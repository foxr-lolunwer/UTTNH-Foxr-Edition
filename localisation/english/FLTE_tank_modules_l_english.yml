 com_night_vision: "Commander Night Vision"
 com_night_vision_desc: "With an infrared spotlight and sight, this set allows the commander to see clearly even on dark nights."
 early_modern_radio: "Early Modern Radio"
 early_modern_radio_desc: "With support for multi-channel usage, this radio allows a tank to communicate with several others over multiple channels."
 modern_radio: "Modern Radio"
 modern_radio_desc: "Utilizing sub-band coding, which broadcasts an operator's voice over multiple frequencies, our communications are extremely secure and difficult to decrypt."
 long_range_radio: "Long Range Radio"
 long_range_radio_desc: "The strongest tank radio sets in WW2, operating at 50 watts, tended to be useless over 10 kilometers. The strongest tank radio sets of the 1970s, however, could easily communicate over 50+ kilometers. This, combined with pulse code modulation encryption, has resulted in near-perfect communication between entire battalions of tanks."
 tank_composite_armor: "Composite Armor"
 tank_composite_armor_desc: "By sandwiching either glass, silicon, or some other material, between two plates of steel, an armor plate is much better at resisting impacts compared to an equivalent thickness of pure steel. However, the time and materials both result in a higher cost."
 tank_spaced_armor: "Spaced Armor"
 tank_spaced_armor_desc: "While not as effective at stopping kinetic rounds as composite armor, simply having a gap between two armor plates can protect against shaped charge munitions, and is generally a fair bit cheaper."
 reactive_plate: "Reactive Plate"
 reactive_plate_desc: "Reactive armor uses a small explosive charge sandwiched between two metal plates to disrupt the effect of shaped charge munitions. By detonating right as the shaped charge goes off, a small reactive plate can withstand even the heaviest of explosively-formed penetrators."
 early_gps: "Early GPS"
 early_gps_desc: "GPS - Global Positioning Systems. While this early implementation isn't terribly accurate, and has issues with reliability, it allows a tank crew to know their position in the world within 100 meters, a huge tactical advantage."
 modern_gps: "Modern GPS"
 modern_gps_desc: "Combined with more advanced satellites, a digital display, and a reliable signal receiver, this GPS suite means that no tank will ever get lost again."
 adv_dozer_blade: "Advanced Dozer Blade"
 adv_dozer_blade_desc: "By using stronger motors, as well as lifting arms and a ridged head, this blade can dig up even moderately rough soil."
 modern_dozer_blade: "Modern Dozer Blade"
 modern_dozer_blade_desc: "While not much different mechanically from previous models, this blade has a much smaller form factor when stowed, as well as using composite alloys to enable using all but solid stone for entrenchment."
 adv_optics: "Advanced Optics"
 adv_optics_desc: "The earliest tank optics were literally holes or slits cut into the hull, so the crew could look out. This was dangerous, as bullet fragments and shrapnel could enter, resulting in often lethal injuries. While vision blocks and periscopes have helped somewhat, the clarity of these devices is still not great. However, as manufacturing methods are refined, new vision devices can be developed which allow for unprecedented levels of visibility and crew awareness."
 em_optics: "Early Modern Optics"
 em_optics_desc: "By using multi-layer scratch-resistent glass, a clear sight picture is established. Combined with rotating mounts, the crew is able to be adequately aware of their surroundings."
 modern_optics: "Modern Optics"
 modern_optics_desc: "With the development of night vision, special periscopes were developed which were interchangeable with regular periscopes, but were designed to see in the infrared range. This, combined with laminated silicon-glass, enables the tank crew to notice things that previously would have been invisible."
 wp_smoke: "WP Smoke"
 wp_smoke_desc: "White phosphorus, or 'Willy Pete', is an incendiary mixture which causes intense burns to the skin, as well as creating a thick blanket of smoke."
 cutting_corner: "Cutting corners"
 cutting_corner_desc: "By using cheaper steel, simplified casts, and omitting some features such as heat treatment or lamination, we can significantly reduce the time and expense involved in building a vehicle. However, this will result in far more frequent breakdowns, and may not be worth it in the long run."
 lean_fuel: "Lean Fuel"
 lean_fuel_desc: "The internal combustion engine combines both oxygen and fuel, usually gasoline or diesel, to create power. By using less fuel per ignition, and with artificial additives such as ethanol, we can decrease the oil usage of our vehicles. However, this may result in more frequent breakdowns - an engine running on a leaner mix will, paradoxically, run much hotter compared to an engine running rich."
 fair_repair: "Fair Repair"
 adv_auto_loader: "Advanced Auto Loader"
 adv_auto_loader_desc: "Early auto loaders were limited by their inherent unreliability, and the need to re-load them every 4 or 5 rounds. They also tended to require human work to complete the loading process. However, this model is truly automated, has space for at least 7 rounds, and is far more reliable."
 earlt_modern_auto_loader: "Early Modern Auto Loader"
 earlt_modern_auto_loader_desc: "Previous auto loaders tended to be of a 'drum' design - 7 to 10 rounds, in a rotating drum, places below the gun breech. Such a design was simple, small, and fast - but the drum could only hold one type of ammo, and manual loading was required for different types. This auto loader, by comparison, is much more adaptive, enabling several different types of rounds to be loaded via the auto loader. While not advanced enough to fully eliminate the need for a loader crewmember, this system greatly reduces the fatigue experience by human loaders."
 modern_auto_loader: "Modern Auto Loader"
 modern_auto_loader_desc: "An auto loader system reliable enough to eliminate the need for a human loader, while providing a dependable rate-of-fire over an extended period of time. With a capacity upwards of 20 rounds, and the ability to complete the loading process without any human intervention, this expensive system is excellent for a tank on the attack."
 advanced_reactive_plate:"Advanced Reactive Plate"
 advanced_reactive_plate_desc: "With a better explosive mixture, and a smaller delay between activation and detonation, this plate can withstand even high-velocity sabot shells."
 advanced_tank_composite_armor:"Advanced Composite Armor"
 advanced_tank_composite_armor_desc: "Early composite armor involved just a few layers, usually steel-glass-steel or some such arrangement. By combining many layers of composite materials, sandwiched between steel plates, this armor layout is expensive but provides unparalleled protection against all types of munitions."
 hard_kill_system:"Hard Kill Device"
 hard_kill_system_desc:"Hard kill systems are designed to destroy incoming projectiles, either missiles or even shells, by responding with a projectile of their own. With high-speed computers and sensors, a small metal plate can destroy an incoming danger within milliseconds."
 apfsds:"APFSDS Shell"
 apfsds_desc: "Armor Piercing Fin Stabilized Discarding Sabot Shells, or APFSDS for short, are a type of high-velocity armor piercing munition that can defeat all but the absolute heaviest of armor. They are so fast, that they won't even ricochet - they will shatter on a heavy angle instead."
 atgm:"ATGM Launcher"
 atgm_desc:"The Anti-Tank Guided Missile launcher, or ATGM launcher, uses either wired or wireless communication systems to guide a missile equipped with a shaped charge warhead to a target, usually a tank."
 heat_fs:"HEAT-FS Shell"
 heat_fs_desc:"High Explosive Anti Tank, Fin Stabilized, or HEAT-FS for short, is an evolution of previous HEAT shells. With a concave front, a so-called shaped charge lined with copper can penetrate thick armor. However, when the shell is spinning, as when fired out of a rifle gun, the copper penetrator will dissipate, resulting in much reduced armor penetration performance. Stabilizing fins counteract this rotation, resulting in a charge that can penetrate almost half a meter of steel armor."
 besh: "Hesh"
 besh_desc: ""
 tank_nera_armor: "NERA Armor"
 tank_nera_armor_desc: ""
 add_on_armor: "Turret Skirt"
 add_on_armor_desc: ""
