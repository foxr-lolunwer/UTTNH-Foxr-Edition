 ship_60_light_battery: "1960 轻型火炮"
 ship_60_light_battery_desc: "相较于单纯增加火炮数量和口径，我们更注重提高现有火炮的射速与精确性。这款火炮配备了先进的测距装置和自动装填系统，即使与早期的一些巡洋舰相比，也毫不逊色。"
 ship_70_light_battery: "1970 轻型火炮"
 ship_70_light_battery_desc: "我们不会增加火炮数量或口径，而是专注于提高火炮的射速和准确性。这门火炮配备了测距仪和先进的自动装弹机，火力可与一些早期巡洋舰相媲美"
 ship_80_light_battery: "1980 轻型火炮"
 ship_80_light_battery_desc: "我们不会增加火炮数量或口径，而是专注于提高火炮的射速和准确性。这门火炮配备了测距仪和先进的自动装弹机，火力可与一些早期巡洋舰相媲美。"
 ship_90_light_battery: "1990 轻型火炮"
 ship_90_light_battery_desc: "凭借自动目标搜索与锁定能力，该火炮可在很大程度上摆脱人工操作，实现智能化作战。"
 ship_ciws_1: "1980 近防武器系统"
 ship_ciws_1_desc: "近程防御武器系统是一种点防御武器系统，用于探测和摧毁已经突破外部防御的短程来袭导弹和敌机，通常安装在海军舰船上。几乎所有级别的大型现代战舰都配备了某种近程防御武器系统装置。"
 ship_ciws_2: "1990 近防武器系统"
 ship_ciws_2_desc: "近程防御武器系统是一种点防御武器系统，用于探测和摧毁已经突破外部防御的短程来袭导弹和敌机，通常安装在海军舰船上。几乎所有级别的大型现代战舰都配备了某种近程防御武器系统装置。"
