 rocketry60: "1960 火箭技术"
 rocketry60_desc: "液氢发动机技术最早由美国成功突破，其代表性的RL-10发动机于1962年成功首飞。阿波罗计划采用了氢氧发动机；由于液氢燃料具有更高的比冲，使得火箭级间的质量得以显著降低，进而降低了航天器的整体尺寸与任务成本。"
 rocketry70: "1970 火箭技术"
 rocketry70_desc: "改进的设计使得速度更快、杀伤力更大的导弹得以问世。"
