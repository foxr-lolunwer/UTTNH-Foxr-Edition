 ship_torpedo_sub_5: "1950 Sub Torpedo"
 ship_torpedo_sub_5_desc: "Post war development of submarine torpedoes included usage of a trailing wire for mid-course guidance through the submarine's fire control system."
 ship_torpedo_sub_6: "1955 Sub Torpedo"
 ship_torpedo_sub_6_desc: "Improvments in the guidance as well as new materials enabled the torpedoes to be more acurate and fast."
 ship_torpedo_sub_7: "1960 Sub Torpedo"
 ship_torpedo_sub_7_desc: "A new guidance method was introduced in the 60s was Wake homing.The torpedo is fired to cross behind the stern of the target ship through the wake, as it does so it uses sonar to look for changes in the water caused by the passage of the ship, such as the small air bubbles. When these are detected the torpedo turns toward the ship then follows a zig-zag course, turning when it detects the outer edge of the wake, to keep itself in the wake. This will eventually bring it to the rear of the ship, where its warhead can do the most damage to propulsion and steering.The system is difficult to jam, though can be distracted by other ships crossing the wake."
 ship_torpedo_sub_8: "1970 Sub Torpedo"
 ship_torpedo_sub_8_desc: "They were designed to sink deep-diving nuclear-powered submarines and high-performance surface ships."
 ship_torpedo_sub_9: "1980 Sub Torpedo"
 ship_torpedo_sub_9_desc: "The 80s torpedo wasitted with both active and passive sonar and could be remotely controlled through a thin wire which connected it to the launching submarine. Wire guidance permits a torpedo to be launched on-first-warning, i.e. when a target is first detected at long range. This permits the torpedo the time needed to close the range while target course and speed is being updated by the submarine's superior sensors and transmitted 'down-the-wire'. The torpedo can also be reassigned to another target or recalled."
 ship_torpedo_sub_10: "1990 Sub Torpedo"
 ship_torpedo_sub_10_desc: "In a typical engagement, these new torpedoes will run out wire-guided to the general vicinity of the target and then conduct a covert passive search. The high-capacity guide wire system, specifically designed to match the Spearfish's manoeuvre and speed envelope, provides two-way data exchange between the torpedo and launch submarine, maximising the submarine's organic sensor and combat control capabilities.Once at close range the torpedo uses active sonar to classify and home in on its target. High-power transmissions and sophisticated signal processing enable it to accurately discriminate targets from background noise and ensure high resistance to acoustic countermeasures and/or evasive manoeuvres."
