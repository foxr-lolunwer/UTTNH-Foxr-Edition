 ship_torpedo_5_short: "鱼雷发射器 V"
 ship_torpedo_5_desc: ""
 ship_torpedo_sub_5: "1950潜射鱼雷"
 ship_torpedo_sub_5_desc: "随着战后技术的进步，潜艇鱼雷的制导方式得到了显著改进。其中一项关键技术是采用拖曳导线，从而让潜艇能够利用自身的火控系统对鱼雷进行中段指令修正。"
 ship_torpedo_sub_6: "1955潜射鱼雷"
 ship_torpedo_sub_6_desc: "制导系统的改进和新材料使得鱼雷更加精确和快速。"
 ship_torpedo_sub_7: "1960潜射鱼雷"
 ship_torpedo_sub_7_desc: "在20世纪60年代，尾流自导技术被引入鱼雷制导。鱼雷发射后，会横向穿过目标舰艇尾部产生的尾流。在此过程中，鱼雷利用声呐探测舰艇经过时在水中留下的变化，例如微小的气泡。当探测到这些变化时，鱼雷便转向目标舰艇，然后采取“之”字形航线，即当探测到尾流外边缘时便转向，以始终保持在尾流中。这种方式最终会将鱼雷引导至舰艇尾部，从而最大程度地破坏推进系统和转向系统。该系统难以干扰，但可能会因其他舰船穿过尾流而受到干扰。"
 ship_torpedo_sub_8: "1970潜射鱼雷"
 ship_torpedo_sub_8_desc: "它们的设计目的是击沉深海核动力潜艇和高性能水面舰艇。"
 ship_torpedo_sub_9: "1980潜射鱼雷"
 ship_torpedo_sub_9_desc: "20世纪80年代的鱼雷同时配备了主动与被动声呐系统，并采用线导技术，通过细线与发射潜艇连接，接受远程控制。线导技术的优势在于允许在远距离探测到目标的第一时间就发射鱼雷。随后，潜艇利用其强大的传感器持续更新目标的航向和速度信息，通过导线传输至鱼雷，确保其精确命中。此外，线导技术还允许潜艇随时将鱼雷重新定向至其他目标或将其召回。"
 ship_torpedo_sub_10: "1990潜射鱼雷"
 ship_torpedo_sub_10_desc: "这些新型鱼雷在典型的作战场景中，首先使用线导模式进入目标大致区域，随后切换到被动声呐模式进行隐蔽搜索。特别值得一提的是，专为配合旗鱼式鱼雷的机动性和速度而设计的高容量线导系统，可以实现鱼雷与发射潜艇之间的双向数据传输，最大化地利用了潜艇的传感器和作战控制能力。当鱼雷接近目标时，将启用主动声呐进行目标分类和精确定位。高功率声呐发射与尖端的信号处理能力相结合，确保了鱼雷能够准确分辨目标信号，同时具备极强的抗干扰能力和抗规避能力。"
