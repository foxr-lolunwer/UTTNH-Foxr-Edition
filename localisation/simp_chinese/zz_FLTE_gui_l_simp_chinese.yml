  FLTE_welcome_menu_clicked_window_4_link_3_button_1_tooltip: "(Vanilla) Industrial Expansion的创意工坊界面"
  FLTE_welcome_menu_clicked_window_4_link_3_button_2_tooltip: "(Rt56) Industrial Expansion的创意工坊界面"

  FLTE_welcome_menu_clicked_window_5_text: "模组名：UTTNH Foxr Edition\n当前版本：$FLTE_LOCT_mod_version$\n鸣谢列表：\nUTTNH_2.0：授权发布独立分支和使用后续更新内容的权利\n(Rt56) Industrial Expansion - Extra Building Slots and Resources!：允许发布修改后的版本"