 GER_heavy_tank_equipment_4: "Panzerkampfwagen VIII Maus"
 GER_heavy_tank_equipment_4_short: "Maus"
 GER_heavy_tank_equipment_4_desc: "Known under the informal name Königstiger but, often semi-literally translated as the King Tiger by Allied soldiers, the design followed the same concept as the Tiger I, but was intended to be even more formidable. The Tiger II combined the thick armor of the Tiger I with the sloped armor used on the Panther medium tank. The tank weighed almost seventy metric tons, was protected by 100 to 180mm of armor to the front and was armed with the long barreled 8.8 cm Kampfwagenkanone 43 L/71 gun."
 GER_heavy_tank_equipment_5: "Panzerkampfwagen E-100"
 GER_heavy_tank_equipment_5_short: "E-100"
 GER_heavy_tank_equipment_5_desc: "The Panzerkampfwagen E-100 (Gerät 383) (TG-01) was a German super-heavy tank design developed towards the end of World War II. It was proposed to be the basis for a heavy artillery system, an anti-aircraft vehicle, and a heavy tank destroyer."
