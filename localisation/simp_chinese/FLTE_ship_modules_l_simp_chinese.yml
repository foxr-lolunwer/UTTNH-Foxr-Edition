 ship_heavy_ASM_battery_1: "1955年重型反舰导弹"
 ship_heavy_ASM_battery_1_desc: "苏联秉持着区域拒止和摧毁美国航母舰队的军事原则，因此，他们设计的重型反舰导弹专注于使用大当量战斗部，力求对敌方主力舰造成尽可能大的破坏。"
