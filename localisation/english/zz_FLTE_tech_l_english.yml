 FLTE_tech_tier_ordn_1: "Army Ordnance T1"
 FLTE_tech_tier_ordn_1_desc: "We will establish a modern, standardized ordnance manufacturing system, abandoning traditional hand-forging methods in favor of universal military production standards. This will enable mass assembly-line production of standardized firearms and artillery, completing the modern iteration of basic army weaponry."
 FLTE_tech_tier_ordn_2: "Army Ordnance T2"
 FLTE_tech_tier_ordn_2_desc: "We will deepen research into metallurgy and ballistics, optimizing artillery barrel materials and structural designs to improve pressure resistance, heat endurance, and service life. Simultaneously, we will refine infantry small arms mechanisms, enhancing firearm reliability and firing stability."
 FLTE_tech_tier_ordn_3: "Army Ordnance T3"
 FLTE_tech_tier_ordn_3_desc: "We will advance the motorized adaptation of heavy artillery using mechanized towing equipment, while building a standardized mechanized infantry weapons system. Unifying specifications across individual, squad, and support weaponry will fulfill the requirements of large-scale field combat."
 FLTE_tech_tier_ordn_4: "Army Ordnance T4"
 FLTE_tech_tier_ordn_4_desc: "We will optimize forging processes and ammunition design for large-caliber artillery, upgrading armor-piercing and high-explosive munition performance. This will comprehensively bolster the army's frontal assault, armor penetration, and battlefield firepower suppression capabilities."
 FLTE_tech_tier_ordn_5: "Army Ordnance T5"
 FLTE_tech_tier_ordn_5_desc: "We will overcome bottlenecks in shaped-charge anti-armor technology and individual automatic weapons development, iterating anti-tank munitions and squad-level automatic firearms. This will deliver all-around improvements to infantry firepower density, accuracy, and anti-armor capabilities."
 FLTE_tech_tier_ordn_6: "Army Ordnance T6"
 FLTE_tech_tier_ordn_6_desc: "We will integrate anti-tank guided weapons with vehicle-mounted mechanized fire-control systems, merging precision guidance technology into conventional ground ordnance to build a high-precision, multi-layered ground fire support network."
 FLTE_tech_tier_ordn_7: "Army Ordnance T7"
 FLTE_tech_tier_ordn_7_desc: "We will fuse microelectronic control technology with lightweight, high-strength composite materials to complete the digital transformation of ordnance equipment, achieving all-weather, high-precision, and automated operation capabilities across all weapon systems."
 FLTE_tech_tier_vehc_1: "Land Vehicles T1"
 FLTE_tech_tier_vehc_1_desc: "We will explore adapting internal combustion engines to tracked and wheeled chassis, converting civilian vehicle architectures into military transports to create first-generation mobile platforms capable of field transport and basic tactical breakthroughs."
 FLTE_tech_tier_vehc_2: "Land Vehicles T2"
 FLTE_tech_tier_vehc_2_desc: "We will optimize vehicle drivetrains and suspension systems to boost off-road mobility, establishing common chassis manufacturing standards for military trucks, railway locomotives, and light armored vehicles to refine our basic military vehicle lineup."
 FLTE_tech_tier_vehc_3: "Land Vehicles T3"
 FLTE_tech_tier_vehc_3_desc: "We will outfit vehicles with standardized high-power engines and specialized military hulls, drastically increasing overall throughput and payload efficiency for army tactical mobility, troop transport, supply movement, and railway logistics."
 FLTE_tech_tier_vehc_4: "Land Vehicles T4"
 FLTE_tech_tier_vehc_4_desc: "We will master core heavy-vehicle technologies—including heavy-duty suspensions and high-torque transmissions—to meet the mass production and high-intensity combat demands of heavy armored vehicles, half-tracks, and heavy wheeled transports."
 FLTE_tech_tier_vehc_5: "Land Vehicles T5"
 FLTE_tech_tier_vehc_5_desc: "We will drive a comprehensive shift toward mechanization and diesel power across all land vehicle categories, developing specialized tracked infantry fighting vehicles and heavy logistics prime movers to specialize operational roles in battlefield mobility and logistical support."
 FLTE_tech_tier_vehc_6: "Land Vehicles T6"
 FLTE_tech_tier_vehc_6_desc: "We will adopt high-output integrated powerpacks and common modular chassis, building a standardized wheeled tactical vehicle system to establish an all-terrain, rapid-response ground mobile combat network."
 FLTE_tech_tier_vehc_7: "Land Vehicles T7"
 FLTE_tech_tier_vehc_7_desc: "We will integrate onboard smart electronic management systems, advanced protective armor, and modular chassis to digitize tactical and support vehicles, significantly raising battlefield survivability and mission adaptability."
 FLTE_tech_tier_air_1: "Air Equipment T1"
 FLTE_tech_tier_air_1_desc: "We will push wood-and-fabric aircraft structures and early piston engines to their limits, upgrading initial airframes from simple tactical reconnaissance platforms into military aircraft capable of basic air-to-air and air-to-ground strikes."
 FLTE_tech_tier_air_2: "Air Equipment T2"
 FLTE_tech_tier_air_2_desc: "We will master all-metal airframe manufacturing and cantilever monoplane aerodynamic design, establishing specialized military aircraft R&D systems by branching into dedicated fighters, close-support aircraft, and multi-engine bombers."
 FLTE_tech_tier_air_3: "Air Equipment T3"
 FLTE_tech_tier_air_3_desc: "We will deploy high-horsepower piston engines, variable-pitch propellers, and enclosed cockpits, optimizing fundamental flight characteristics to raise operational ceilings, extend range, and increase penetration speeds."
 FLTE_tech_tier_air_4: "Air Equipment T4"
 FLTE_tech_tier_air_4_desc: "We will overcome key hurdles in engine turbocharging, high-octane aviation fuel, and large internal bomb bays, enabling the mass production and combat deployment of heavy strategic bombers and high-altitude, high-speed interceptors."
 FLTE_tech_tier_air_5: "Air Equipment T5"
 FLTE_tech_tier_air_5_desc: "We will adopt swept-wing aerodynamic configurations and break through core early jet engine technology, transitioning aviation propulsion from piston to jet power to usher in the era of jet fighters."
 FLTE_tech_tier_air_6: "Air Equipment T6"
 FLTE_tech_tier_air_6_desc: "We will utilize afterburning turbojets, turbofans, and supersonic aerodynamic designs to develop all-weather interceptors, precision tactical bombers, and VTOL aircraft, assembling a modern, multi-role air combat fleet."
 FLTE_tech_tier_air_7: "Air Equipment T7"
 FLTE_tech_tier_air_7_desc: "We will equip aircraft with high-thrust-to-weight-ratio turbofans, high-precision airborne radars, and stealth airframes, comprehensively enhancing situational awareness, supersonic cruise, and covert strike capabilities for a modern, digitized air force."
 FLTE_tech_tier_naval_1: "Naval Equipment T1"
 FLTE_tech_tier_naval_1_desc: "We will establish modern standardized shipbuilding techniques and watertight compartment structures, integrating early steam propulsion and naval artillery to build ironclad and cruiser fleets capable of ocean navigation and basic fleet engagements."
 FLTE_tech_tier_naval_2: "Naval Equipment T2"
 FLTE_tech_tier_naval_2_desc: "We will adopt high-pressure steam turbines, face-hardened armor plate, and armored belt designs, standardizing construction codes across capital ships, light escorts, and civilian transports to mature our naval fleet architecture."
 FLTE_tech_tier_naval_3: "Naval Equipment T3"
 FLTE_tech_tier_naval_3_desc: "We will adopt all-big-gun capital ship layouts with high-efficiency heavy naval guns and develop dedicated amphibious landing craft, significantly enhancing fleet firepower in decisive ocean battles, cross-sea power projection, and amphibious operations."
 FLTE_tech_tier_naval_4: "Naval Equipment T4"
 FLTE_tech_tier_naval_4_desc: "We will master high-pressure boilers, high-strength fully welded hulls, and modern auxiliary machinery, enabling mass construction of heavy battleships, fast destroyers, and large fleet replenishment ships."
 FLTE_tech_tier_naval_5: "Naval Equipment T5"
 FLTE_tech_tier_naval_5_desc: "We will update naval propulsion systems by introducing diesel and gas turbines while refining hull streamlining, developing specialized dock landing ships, ocean fleet replenishment platforms, and modern quiet submarines."
 FLTE_tech_tier_naval_6: "Naval Equipment T6"
 FLTE_tech_tier_naval_6_desc: "We will master naval nuclear propulsion technology, upgrading modern ship defensive systems and long-range logistics to create surface and submarine fleets capable of unlimited range and extended oceanic deployments."
 FLTE_tech_tier_naval_7: "Naval Equipment T7"
 FLTE_tech_tier_naval_7_desc: "We will apply automated shipbuilding, low-observable stealth hull designs, and integrated electric propulsion systems to achieve stealthy, fully electric, and highly automated naval vessels suited for modern blue-water naval warfare."
 FLTE_tech_tier_infr_1: "Industrial Development T1"
 FLTE_tech_tier_infr_1_desc: "We will set basic industrial production standards and steam power support systems, consolidating scattered artisan workshops to establish early modern industrial infrastructure capable of assembly-line mass production."
 FLTE_tech_tier_infr_2: "Industrial Development T2"
 FLTE_tech_tier_infr_2_desc: "We will roll out standardized power grids and universal industrial hardware, instituting construction and production norms for heavy industrial plants, mining, and major infrastructure projects."
 FLTE_tech_tier_infr_3: "Industrial Development T3"
 FLTE_tech_tier_infr_3_desc: "We will widespread assembly-line operations and deploy large smelting blast furnaces and mechanized construction equipment, drastically boosting manufacturing efficiency and the construction speed of heavy arms facilities and infrastructure."
 FLTE_tech_tier_infr_4: "Industrial Development T4"
 FLTE_tech_tier_infr_4_desc: "We will master continuous steel rolling, mass production of prefabricated components, and heavy lifting equipment, enabling concurrent, high-efficiency construction of large defense installations, transit lines, and industrial bases."
 FLTE_tech_tier_infr_5: "Industrial Development T5"
 FLTE_tech_tier_infr_5_desc: "We will push for factory automation and upgrade modern chemical industrial systems, refining resource processing and utilization to shift industrial output toward high-efficiency, high-capacity, and precision operations."
 FLTE_tech_tier_infr_6: "Industrial Development T6"
 FLTE_tech_tier_infr_6_desc: "We will introduce CNC machining equipment, high-voltage bulk power networks, and modern building material production lines, constructing a resilient, fast-expanding modern industrial foundation tailored to wartime demands."
 FLTE_tech_tier_infr_7: "Industrial Development T7"
 FLTE_tech_tier_infr_7_desc: "We will deploy computer-integrated manufacturing, fully automated production lines, and rapid modular construction technologies, achieving modern upgrades characterized by high precision, extreme efficiency, and rapid response times across engineering and manufacturing."
 FLTE_tech_tier_prod_1: "Equipment Production T1"
 FLTE_tech_tier_prod_1_desc: "We will establish basic labor accounting systems and fine-grained division of labor, applying scientific management principles and engineering experience to arms production to improve standardized shop-floor efficiency."
 FLTE_tech_tier_prod_2: "Equipment Production T2"
 FLTE_tech_tier_prod_2_desc: "We will enforce interchangeable part standards and specialized tooling/jig systems, using industrial engineering to streamline shop floor workflows and reduce manual fitting and adjustment costs during weapon assembly."
 FLTE_tech_tier_prod_3: "Equipment Production T3"
 FLTE_tech_tier_prod_3_desc: "We will set up pulse moving assembly lines, refine wartime labor mobilization models, and optimize workstation layouts through ergonomics to achieve continuous, mass production of complex arms."
 FLTE_tech_tier_prod_4: "Equipment Production T4"
 FLTE_tech_tier_prod_4_desc: "We will apply operational research production scheduling, adopt precision stamping and die-casting techniques, and institute thorough quality control procedures to significantly shorten production cycles and capacity ramp-up times for high-end arms."
 FLTE_tech_tier_prod_5: "Equipment Production T5"
 FLTE_tech_tier_prod_5_desc: "We will integrate statistical process control with modern precision machining, maintaining tight tolerance standards on ordnance components while vastly raising labor efficiency and capacity conversion rates."
 FLTE_tech_tier_prod_6: "Equipment Production T6"
 FLTE_tech_tier_prod_6_desc: "We will introduce automated assembly lines, lean manufacturing practices, and scientific labor incentives to establish a low-waste, highly adaptable, and modern military-industrial production network."
 FLTE_tech_tier_prod_7: "Equipment Production T7"
 FLTE_tech_tier_prod_7_desc: "We will integrate computer-aided manufacturing, flexible manufacturing systems, and end-to-end supply chain management, making arms production automated, resilient, and custom-tailored on demand to reach the ultimate modern iteration of arms manufacturing."
 FLTE_tech_tier_elec_1: "Electronics T1"
 FLTE_tech_tier_elec_1_desc: "We will define basic applied electromagnetic standards and adapt wireless telegraphy, crystal detectors, and simple relays for industrial use, forging our first practical military electronic communication systems."
 FLTE_tech_tier_elec_2: "Electronics T2"
 FLTE_tech_tier_elec_2_desc: "We will master mass production of vacuum tubes and high-frequency resonant circuits, developing high-frequency tactical field radios and early electromechanical computing units to build a solid foundation for military electronics."
 FLTE_tech_tier_elec_3: "Electronics T3"
 FLTE_tech_tier_elec_3_desc: "We will apply VHF FM communications, electromechanical fire-control computers, and early pulse radars, enabling basic air and sea target detection along with automated ballistic calculations to empower fundamental combat operations."
 FLTE_tech_tier_elec_4: "Electronics T4"
 FLTE_tech_tier_elec_4_desc: "We will master cavity magnetrons, radio proximity fuzes, and vacuum-tube computing components, building high-precision air/sea search radar networks and early military computing platforms."
 FLTE_tech_tier_elec_5: "Electronics T5"
 FLTE_tech_tier_elec_5_desc: "We will advance transistor research and solid-state electronics, deploying airborne and naval 3D search radars alongside fully electronic fire-control systems to make military electronic equipment smaller and far more precise."
 FLTE_tech_tier_elec_6: "Electronics T6"
 FLTE_tech_tier_elec_6_desc: "We will incorporate integrated circuits, pulse-Doppler radars, and general-purpose digital computers, establishing all-weather electronic countermeasures and automated fire-control networks for modern electronic warfare."
 FLTE_tech_tier_elec_7: "Electronics T7"
 FLTE_tech_tier_elec_7_desc: "We will deploy large-scale integrated circuits, active electronically scanned arrays (AESA), and high-performance microprocessors, making military electronics highly integrated and digital to maximize target acquisition, electronic warfare, and command control."
 FLTE_tech_tier_spac_1: "Space Tech T1"
 FLTE_tech_tier_spac_1_desc: "We will refine core theoretical aerodynamics and high-altitude rocketry, mastering liquid oxygen/alcohol bipropellant ratios and basic gyroscopic guidance to develop sounding rockets for initial low-Earth space exploration."
 FLTE_tech_tier_spac_2: "Space Tech T2"
 FLTE_tech_tier_spac_2_desc: "We will overcome multi-stage rocket separation, gimbaled thrust vectoring, and high-altitude telemetry transmission, mastering satellite orbital insertion to make payloads in low Earth orbit a routine reality."
 FLTE_tech_tier_spac_3: "Space Tech T3"
 FLTE_tech_tier_spac_3_desc: "We will develop high-Isp liquid hydrogen/liquid oxygen rocket engines, crew life-support systems, and thermal protection structures, enabling human spaceflight, orbital rendezvous/docking, and routine station operations in LEO."
 FLTE_tech_tier_spac_4: "Space Tech T4"
 FLTE_tech_tier_spac_4_desc: "We will develop super-heavy lift launch vehicles, deep-space tracking networks, and uncrewed planetary probes, establishing capability for deep-space exploration and probe deployments throughout the Earth-Moon system and nearby planets."
 FLTE_tech_tier_spac_5: "Space Tech T5"
 FLTE_tech_tier_spac_5_desc: "We will optimize space-based solar power, deploy an initial commercial communications satellite constellation, and expand modular space stations for routine monitoring and utilization of LEO space and electromagnetic environments."
 FLTE_tech_tier_spac_6: "Space Tech T6"
 FLTE_tech_tier_spac_6_desc: "We will master reusable launch vehicle technology and deploy large orbital optical/infrared arrays and high-precision navigation satellite constellations, constructing an all-weather global space transport and domain awareness network."
 FLTE_tech_tier_spac_7: "Space Tech T7"
 FLTE_tech_tier_spac_7_desc: "We will build massive modular deep-space stations and comprehensive deep-space communication networks, forming orbital defense systems that enable high-frequency, automated space missions and controlled utilization of near-Earth space."
 FLTE_tech_tier_nuclear_1: "Nuclear Tech T1"
 FLTE_tech_tier_nuclear_1_desc: "We will establish comprehensive theoretical foundations in nuclear physics and radiochemistry, discovering uranium isotope fission principles and neutron chain reaction mechanics to lay the ground for atomic energy development."
 FLTE_tech_tier_nuclear_2: "Nuclear Tech T2"
 FLTE_tech_tier_nuclear_2_desc: "We will master gaseous diffusion isotope separation, reactor moderator design, and nuclear implosion core architecture, refining weapons-grade fissile material to build and produce first-generation fission nuclear weapons."
 FLTE_tech_tier_nuclear_3: "Nuclear Tech T3"
 FLTE_tech_tier_nuclear_3_desc: "We will advance thermonuclear fusion theory, mastering lithium deuteride reaction applications and secondary radiation compression to transition from fission to thermonuclear weapons, vastly increasing yield limits."
 FLTE_tech_tier_nuclear_4: "Nuclear Tech T4"
 FLTE_tech_tier_nuclear_4_desc: "We will master commercial pressurized and boiling water reactors, miniaturize nuclear warheads, develop tactical nuclear munitions, and adapt nuclear propulsion for capital warships and submarines."
 FLTE_tech_tier_nuclear_5: "Nuclear Tech T5"
 FLTE_tech_tier_nuclear_5_desc: "We will develop breeder reactor technology and nuclear waste processing systems, optimize warhead safety handling, and achieve efficient civilian nuclear power generation alongside standardized strategic nuclear deterrence deployments."
 FLTE_tech_tier_nuclear_6: "Nuclear Tech T6"
 FLTE_tech_tier_nuclear_6_desc: "We will deploy large-scale commercial nuclear power grids, develop low-residue tactical nuclear munitions, and design compact reactor modules to create a dual-use ecosystem balancing civilian energy supply with flexible strategic retaliation."
 FLTE_tech_tier_nuclear_7: "Nuclear Tech T7"
 FLTE_tech_tier_nuclear_7_desc: "We will break through controlled nuclear fusion, build closed-loop fuel cycles, and engineer micro modular nuclear power sources, fully modernizing atomic energy utilization into a safe, efficient, and highly integrated power model."