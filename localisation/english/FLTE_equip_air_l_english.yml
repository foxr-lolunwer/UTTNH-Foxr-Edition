 cv_fighter_equipment_4_short: "Carrier jet 1946" 
 cv_fighter_equipment_4_desc: "First generation jet fighters are the first attempts at creation of fighter aircraft using jet engines. A few were developed during the closing days of World War II and saw very limited combat operations." 
