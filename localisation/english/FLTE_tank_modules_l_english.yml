 #Modern
 tank_early_modern_cannon:"90mm L/60 Modern Gun"
 tank_early_modern_cannon_desc:"With the introduction of so-called bore evacuators, devices fitted to the barrel of a gun which clears the smoke after firing, a higher powered charge can be used, resulting in greater muzzle velocity and as such, greater armor penetration."
 tank_modern_cannon:"105mm L/58 Smoothbore Gun"
 tank_modern_cannon_desc:"The advent of modern smoothbore guns can fire a shell at much higher velocities and with much less wear, resulting in greatly improved armor penetration. The inherent inaccuracy with smoothbore guns can be offset with the aforementioned higher velocity, as well as fin stabilization."
 tank_advanced_modern_cannon:"120mm L/52 Smoothbore Gun"
 tank_advanced_modern_cannon_desc:"A truly terrifying weapon, using all of the lessons learned from previous developments, capable of projecting a shell at extreme velocities over long distances. Nothing will withstand a shell fired from this gun."
 tank_cold_war_gas_turbine_engine:"Early Cold War Gas Turbine Engine"
 tank_cold_war_gas_turbine_engine_desc:"Compared to early gas turbines, which were essentially just jet engines modified for use in a ground vehicle, this set was designed from the ground up for use in a tank. As such, it is much faster than earlier systems."
 tank_near_end_cold_war_gas_turbine_engine:"Late Cold War Turbine Engine"
 tank_near_end_cold_war_gas_turbine_engine_desc:"Despite using more fuel, the compressor in this gas turbine has a much more optimized design, resulting in extremely high speeds."
 tank_cold_war_diesel_engine:"Early Cold War Diesel Engine"
 tank_cold_war_diesel_engine_desc:"With the development of reliable turbochargers, a diesel engine can be made just as fast as one running on gasoline, while being much reliable and resistent to harsh environments compared to gas turbines."
 tank_near_end_cold_war_diesel_engine:"Late Cold War Diesel Engine"
 tank_near_end_cold_war_diesel_engine_desc:"As the century neared its end, fuel quality and consistency both improved greatly. As such, this engine can be tuned much higher than previously possible, resulting in unparalleled speeds and reliability."
 gen1_night_vision:"1st Generation of Night Vision"
 gen1_night_vision_desc:"A simple active night vision set, using an infrared spotlight and special vision devices for the crew to see in the dark."
 gen2_night_vision:"2nd Generation of Night Vision"
 gen2_night_vision_desc:"By using intensification devices, the infrared spotlight can be removed, while maintaining a good image quality."
 gen3_night_vision:"3rd Generation of Night Vision"
 gen3_night_vision_desc:"Improvements in manufacturing and chemistry have resulted in a night vision set that has similar image quality to daytime vision."
 gen1_thermal_vision:"1st Generation of Thermal Vision"
 gen1_thermal_vision_desc:"All objects above absolute zero temperature emit infrared radiation, however this is usually far too weak to be detected by traditional infrared devices. However, by using special materials such as germanium, calcium floride or crystalline silicon, a lens can be made which permits infrared radiation at the levels required to use as a heat-vision sight."
 gen2_thermal_vision:"2nd Generation of Thermal Vision"
 gen2_thermal_vision_desc:"Early thermal vision devices were unreliable, and had very poor resolution. However, with advances in precision manufacturing, a thermal vision set can now be used to identify objects even over a kilometer away."
 gen3_thermal_vision:"3rd Generation of Thermal Vision"
 gen3_thermal_vision_desc:"By using a digital computer and electronic television, a thermal image of much higher quality and zoom can be established."
 slopped_turret_armor:"Advanced Sloped Turret Armor"
 slopped_turret_armor_desc:"Sloped armour is armour that is neither in a vertical nor a horizontal position. Such angled armour is typically mounted on tanks."
