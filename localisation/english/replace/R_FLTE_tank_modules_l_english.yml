 tank_heavy_cannon: "90mm L/50 Heavy Gun"
 tank_heavy_cannon_desc: "A weapon that can fire a large shell. With exceptional armor penetration and decent performance against soft targets, its biggest drawbacks are the sheer size and cost, which make it too unwieldly to be mounted in most vehicles not specifically designed to carry it."
