 GER_medium_tank_equipment_4_desc: "The Panzerkampfwagen VII Löwe (Lion) was a design for a super-heavy tank created by Krupp for the German government during World War II. The project, initially code-named VK 70.01 (K), never left the drawing board, and was dropped in 5–6 March 1942, in favor of Porsche's heavier Panzer VIII Maus."
