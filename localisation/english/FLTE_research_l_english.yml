 light_battery60: "60s Lightweight Gun"
 light_battery60_desc: "Rather than increasing the number of guns, or the calibre of those guns, we will instead focus on increasing the rate of fire and accuracy of our cannons. Equipped with a rangefinder, and an advanced automatic loader, this gun rivals some earlier cruisers in firepower." 
 light_battery70: "70s Lightweight Gun" 
 light_battery70_desc: "An advanced automatic cannon, 5 or 6 inches in calibre, with a fire rate approaching 60 rounds per minute, this gun can hit a small target at a dozen kilometers." 
 light_battery80: "80s Lightweight Gun" 
 light_battery80_desc: "As computers get smaller and smaller, we've been able to fit this turret with a radar set, integrated into a semi-automatic fire control system." 
 light_battery90: "90s Lightweight Gun" 
 light_battery90_desc: "Capable of finding and locking onto a target automatically, this gun does most of the work without any human intervention." 
