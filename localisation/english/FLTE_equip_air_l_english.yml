 USA_jet_fighter_equipment_3: "North American F-100 Super Saber"
 USA_jet_fighter_equipment_3_short: "F-100 Super Saber" 
 USA_jet_fighter_equipment_3_desc: "The North American F-100 Super Sabre is an American supersonic jet fighter aircraft that served with the United States Air Force (USAF) from 1954 to 1971 and with the Air National Guard (ANG) until 1979. The first of the Century Series of USAF jet fighters, it was the first USAF fighter capable of supersonic speed in level flight.The F-100 was designed by North American Aviation as a higher performance follow-on to the F-86 Sabre air superiority fighter." 
 USA_jet_fighter_equipment_4: "McDonnell F-101 Voodoo" 
 USA_jet_fighter_equipment_4_short: "F-101 Voodoo" 
 USA_jet_fighter_equipment_4_desc: "The McDonnell F-101 Voodoo is a supersonic jet fighter which served the United States Air Force (USAF) and the Royal Canadian Air Force (RCAF)." 
 USA_jet_fighter_equipment_5: "McDonnell Douglas F-4C Phantom II" 
 USA_jet_fighter_equipment_5_short: "F-4C Phantom II" 
 USA_jet_fighter_equipment_5_desc: "The McDonnell Douglas F-4 Phantom II is a tandem two-seat, twin-engine, all-weather, long-range supersonic jet interceptor and fighter-bomber originally developed for the United States Navy by McDonnell Aircraft." 
 USA_jet_fighter_equipment_6: "McDonnell F-4E Phantom II" 
 USA_jet_fighter_equipment_6_short: "F-4E Phantom II" 
 USA_jet_fighter_equipment_6_desc: "F-4C with updated avionics, AN/APQ-109 radar. First flight June 1965. One USAF pilot and two USAF WSOs became aces in F-4Ds." 
