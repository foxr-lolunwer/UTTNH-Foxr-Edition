 aam50: "Early Air to Air missiles" 
 aam50_desc: "The US Navy and US Air Force began equipping guided missiles in 1956, deploying the USAF's AIM-4 Falcon and the USN's AIM-7 Sparrow and AIM-9 Sidewinder. The Soviet Air Force introduced its K-5 (missile) into service in 1957." 
 aam60: "BVR missiles" 
 aam60_desc: "As missile systems have continued to advance, modern air warfare consists almost entirely of missile firing. The use of Beyond Visual Range combat became so pervasive in the US that early F-4 variants were armed only with missiles in the 1960s." 
 aam70: "All aspect missiles" 
