 CZE_heavy_fighter_equipment_1_desc: "One of the major variants of Avia B.534 was Bk.534 designed to carry one 20 mm (0.79 in) Oerlikon FFS-20 cannon firing through the nose, and only two 7.92 mm machine guns to the sides.\n\nHowever, there were some problems with the reconstruction to adapt the new gun. So only few planes were delivered to Czechoslovak air force, the remaining 63 planes from the ordered production block were finished for the Germans." 
