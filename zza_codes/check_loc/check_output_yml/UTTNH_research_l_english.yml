 over_the_horizon_radar: "Over-the-horizon radar" 
 over_the_horizon_radar_desc: "Over-the-horizon radar (OTH), sometimes called beyond the horizon radar (BTH), is a type of radar system with the ability to detect targets at very long ranges, typically hundreds to thousands of kilometres, beyond the radar horizon, which is the distance limit for ordinary radar." 
 esar: "Electronically Steered Array Radar" 
 esar_desc: "In 1959, DARPA developed an experimental phased array radar called Electronically Steered Array Radar (ESAR). It was a large two-dimensional phased array with beam steering controlled by computers instead of requiring mechanical motion of the antenna. The first module, a linear array, was completed in 1960." 
 pesa: "Passive Electronically Scanned Array Radar" 
 pesa_desc: "A passive electronically scanned array (PESA), also known as passive phased array, is an antenna in which the beam of radio waves can be electronically steered to point in different directions in which all the antenna elements are connected to a single transmitter and/or receiver." 
 aesa: "Active Electronically Scanned Array Radar" 
 aesa_desc: "An active electronically scanned array (AESA) is a type of phased array antenna. In the AESA, each antenna element is connected to a small solid-state transmit/receive module under the control of a computer, which performs the functions of a transmitter and/or receiver for the antenna. This contrasts with a passive electronically scanned array (PESA), in which all the antenna elements are connected to a single transmitter and/or receiver" 
 lpi_radar: "Low-probability-of-intercept RADAR" 
 lpi_radar_desc: "A low-probability-of-intercept radar (LPIR) is a radar employing measures to avoid detection by passive radar detection equipment. This can include measure such as frequency agility, where the radar chages frequency every pulse, and extending the length of a pulse to allow for a lower power, and therefore, a lower chance of detection by a RWR system." 
 naval_reactor:"Nuclear marine propulsion" 
 naval_reactor_desc:"Nuclear marine propulsion is propulsion of a ship or submarine with heat provided by a nuclear power plant. The power plant heats water to produce steam for a turbine used to turn the ship's propeller through a gearbox or through an electric generator and motor. Naval nuclear propulsion is used specifically within naval warships such as supercarriers. A small number of experimental civil nuclear ships have been built." 
 naval_reactor_2:"Improved Nuclear marine propulsion" 
 naval_reactor_2_desc:"Early reactors were a heavy and expensive investment, often taking up twice as much space as a diesel engine. While these new reactors are still expensive, we have been able to make them much more powerful, and a lot safer for the operating crews." 
 
 heli_engines:"Rotor system" 
 heli_engines_desc:"A helicopter rotor system is the combination of several rotary wings and a control system that generates the aerodynamic lift force that supports the weight of the helicopter, and the thrust that counteracts aerodynamic drag in forward flight. Each main rotor is mounted on a vertical mast over the top of the helicopter, as opposed to a helicopter tail rotor, which connects through a combination of drive shaft(s) and gearboxes along the tail boom.The name is derived from the Greek words helix, helik-, meaning spiral; and pteron meaning wing." 
 # FLTE code del mechanical_computing
 # FLTE code del mechanical_computing_desc
 # FLTE code del computing_machine
 # FLTE code del computing_machine_desc
 # FLTE code del improved_computing_machine
 # FLTE code del improved_computing_machine_desc
 # FLTE code del advanced_computing_machine
 # FLTE code del advanced_computing_machine_desc
 basic_vacuum_computer: "Basic Vacuum Computers" 
 basic_vacuum_computer_desc: "With this the first vacuum tube based computers grace the world of computing, bringing unseen potential to the field." 
 improved_vacuum_computer: "Improved Vacuum Computers" 
 improved_vacuum_computer_desc: "Multiple strides in vacuum tube based computers have allowed for improvements to these systems, such as dedicated system memory." 
 basic_transistor_computer: "Basic Transistor Computers" 
 basic_transistor_computer_desc: "Beginning to work on computers capable of storing programs and making use of transistors will put us on the path to a Digital Revolution where these machines may be used in nearly any field." 
 comp60: "1960s Computing" 
 comp60_desc: "The 1960s saw large mainframe computers become much more common in large industries and with the US military and space program. IBM became the unquestioned market leader in selling these large, expensive, error-prone, and very hard to use machines." 
 comp65: "Mid 1960s Computing" 
 comp65_desc: "Third generation: 1963 - present - The invention of integrated circuit brought us the third generation of computers. With this invention computers became smaller, more powerful more reliable and they are able to run many different programs at the same time." 
 comp70: "1970s Computing" 
 comp70_desc: "By beginning of the 1970s there were essentially two types of computers. There were room-sized mainframes, costing hundreds of thousands of dollars, that were built one at a time by companies such as IBM and CDC. There also were smaller, cheaper, mass-produced minicomputers, costing tens of thousands of dollars, that were built by a handful of companies, such as Digital Equipment Corporation and Hewlett-Packard Company, for scientific laboratories and businesses." 
 comp80: "1980s Computing" 
 comp80_desc: "The first of the truly modern computers, these machines are hundreds of times more powerful than the previous mainframes, yet take up only a desk's worth of space." 
 comp90: "1990s Computing" 
 comp90_desc: "Between the transistor, gunpowder, the spear, and fire itself, one can argue that the personal computer is among the most important inventions in the world. No longer a state investment, involving millions of dollars and thousands of hours of work, the modern computer is cheaper than a car yet more useful than any weapon of war."
 
 tv_guide: "Television guidance" 
 tv_guide_desc: "Television guidance (TGM) is a type of missile guidance system using a television camera in the missile or glide bomb that sends its signal back to the launch platform. There, a weapons officer or bomb aimer watches the image on a television screen and sends corrections to the missile, typically over a radio control link. Television guidance is not a seeker because it is not automated, although semi-automated systems with autopilots to smooth out the motion are known. They should not be confused with contrast seekers, which also use a television camera but are true automated seeker systems." 
 ir_guide: "Infrared homing" 
 ir_guide_desc: "Infrared homing is a passive weapon guidance system which uses the infrared (IR) light emission from a target to track and follow it. Missiles which use infrared seeking are often referred to as "heat-seekers", since infrared is radiated strongly by hot bodies. Many objects such as people, vehicle engines and aircraft generate and emit heat, and as such, are especially visible in the infrared wavelengths of light compared to objects in the background." 
 laser_guide: "Laser guidance" 
 laser_guide_desc: "Laser guidance is used by military to guide a missile or other projectile or vehicle to a target by means of a laser beam (Lidar), e.g. beam riding guidance or semi-active radar homing (SARH).[7] This technique is sometimes called SALH, for Semi-Active Laser Homing. With this technique, a laser is kept pointed at the target and the laser radiation bounces off the target and is scattered in all directions (this is known as "painting the target", or "laser painting"). The missile, bomb, etc. is launched or dropped somewhere near the target. When it is close enough for some of the reflected laser energy from the target to reach it, a laser seeker detects which direction this energy is coming from and adjusts the projectile trajectory towards the source." 
 laser_guide_mun: "Precision-guided munition" 
 laser_guide_mun_desc: "A precision-guided munition (PGM, smart weapon, smart munition, smart bomb) is a guided munition intended to precisely hit a specific target, to minimize collateral damage and increase lethality against intended targets.Because the damage effects of explosive weapons decrease with distance due to an inverse cube law, even modest improvements in accuracy (hence reduction in miss distance) enable a target to be attacked with fewer or smaller bombs. Thus, even if some guided bombs miss, fewer air crews are put at risk and the harm to civilians and the amount of collateral damage may be reduced." 
