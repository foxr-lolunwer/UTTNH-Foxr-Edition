 over_the_horizon_radar: "超视距雷达"
 over_the_horizon_radar_desc: "超视距雷达（OTH），有时也缩写为BTH，是一种能够探测非常远距离目标的雷达系统，通常可探测距离雷达地平线数百至数千公里的地方，这是普通雷达的距离极限。"
 esar: "电子控制阵雷达"
 esar_desc: "1959年，美国国防高级研究计划局开发了一种名为电子控制阵列雷达（ESAR）的实验性相控阵雷达。该雷达拥有一个大型二维相控阵，且波束控制由计算机控制，而不需要天线的机械运动。第一个模块，即线性阵列，于1960年完成。"
 pesa: "无源电子扫描阵雷达"
 pesa_desc: "无源电子扫描阵列（PESA），又称无源相控阵雷达，是一种天线，其无线电波波束可以通过电子方式控制，指向不同的方向。该天线的所有天线单元均连接至单个发射器和/或接收器。"
 aesa: "有源电子扫描阵雷达"
 aesa_desc: "有源电子扫描阵列 (AESA) 是一种先进的相控阵天线。与传统的无源电子扫描阵列 (PESA) 相比，有源电子扫描阵列 的每个天线单元都配备了一个由计算机控制的微型固态收发模块，从而可以更加灵活地控制信号的发射和接收。而在无源电子扫描阵列中，所有的天线单元都连接到同一个发射机和接收机，灵活性相对较弱。"
 lpi_radar: "低截获概率雷达"
 lpi_radar_desc: "低截获概率雷达（LPIR）是一种采取措施避免被无源雷达探测设备探测到的雷达。这些措施包括频率捷变，即使雷达每脉冲改变一次频率，并延长脉冲长度以降低功率，从而降低被RWR系统探测到的几率。"
 naval_reactor: "核动力船舶推进系统"
 naval_reactor_desc: "核动力船舶推进系统是指利用核反应堆产生的热能驱动船舶或潜艇。其原理是通过核反应堆加热水产生高压蒸汽，驱动汽轮机运转，最终带动螺旋桨，或驱动发电机为电动机供电进而驱动螺旋桨。海军主要在军用舰艇上采用核动力，如超级航母。目前仅有少量试验性民用核动力船只。"
 naval_reactor_2: "改进核动力船舶推进系统"
 naval_reactor_2_desc: "早期反应堆是一项沉重而昂贵的投资，通常占用的空间是柴油发动机的两倍。虽然这些新反应堆仍然很昂贵，但我们已经能够使它们更加强大，并且对操作人员来说更加安全。"
 heli_engines: "旋翼系统"
 heli_engines_desc: "直升机旋翼系统是多个旋翼机翼和控制系统的组合，可产生支撑直升机重量的气动升力，以及抵消前飞气动阻力的推力。每个主旋翼都安装在直升机顶部的垂直桅杆上，而不是直升机尾桨，后者通过尾梁上的传动轴和变速箱组合连接。该名称源自希腊语 helix，helik- 意为螺旋；pteron 意为机翼"
 basic_vacuum_computer: "基础真空管计算机"
 basic_vacuum_computer_desc: "伴随着第一代真空管计算机的出现，计算机领域展现出过去无法想象的可能性。"
 improved_vacuum_computer: "改进真空管计算机"
 improved_vacuum_computer_desc: "由于在真空管计算机方面取得诸多进展，使得诸如专用系统内存等系统改进成为现实。"
 basic_transistor_computer: "基础晶体管计算机"
 basic_transistor_computer_desc: "致力于开发能够存储程序并基于晶体管的计算机，标志着我们即将步入数字革命的时代，那时，计算机将在各个领域得到广泛应用。 "
 comp60: "1960 计算机"
 comp60_desc: "20世纪60年代，随着美国的军事和太空计划，大型计算机在大型工业中变得越来越普遍。IBM在销售这些大型、昂贵、易出错且使用非常困难的机器方面成为了无可置疑的市场领导者。"
 comp65: "1960 中期计算机"
 comp65_desc: "1963年至今——集成电路的发明为我们带来了第三代计算机。有了这项发明，计算机变得更小、更强大、更可靠，并且能够同时运行许多不同的程序。"
 comp70: "1970 计算机"
 comp70_desc: "到20世纪70年代初，基本上有两种类型的计算机：一种是以IBM、CDC等公司为代表的，按需定制的，占据大量空间的大型主机，单台造价昂贵，通常超过数十万美元。 另一种则是由数字设备和惠普等公司开发的，体积更小、成本更低的，面向科学研究和商业应用的，批量生产的迷你计算机，价格约为数万美元。"
 comp80: "1980 计算机"
 comp80_desc: "作为第一台真正现代化的计算机，这些机器比以前的大型机功能强大数百倍，但只需占用一张桌子的空间。"
 comp90: "1990 计算机"
 comp90_desc: "个人电脑是继晶体管、火药、长矛和火之后世界上最重要的发明之一。现代电脑不再是政府投资，不再需要数百万美元和数千小时的工作，它比汽车便宜，但比任何战争武器都更有用。"
 tv_guide: "电视制导"
 tv_guide_desc: "电视制导（TGM）是一种导弹制导系统，它利用导弹或滑翔炸弹中的电视摄像机将信号发送回发射平台。 在那里，武器操作员或投弹手在电视屏幕上观看图像，并通过通常通过无线电控制链路将修正指令发送给导弹。 电视制导不是自动制导，尽管也存在带有自动驾驶仪的半自动化系统以平滑运动。 它们不应与光学对比指导混淆，后者也使用电视摄像机，但其属于真正的自动化导引的系统。"
 ir_guide: "红外制导"
 ir_guide_desc: "红外制导是一种被动武器制导系统，无需主动发射信号，而是依靠接收目标自身产生的红外 (IR) 辐射进行目标跟踪和引导。 由于红外辐射强度与物体温度直接相关，因此利用红外制导技术的导弹通常被称为热能制导。 包括人员、载具引擎以及飞行器等诸多目标都会产生热量并辐射红外线，这些热源目标由于在红外波段比背景物体具有更明显的特征，故易于被红外制导导弹锁定。"
 laser_guide: "激光制导"
 laser_guide_desc: "激光引导是一种应用于军事领域的精确打击技术，通过激光雷达（Lidar）产生的激光束引导导弹、炮弹或其他发射或运载体准确命中目标。典型的激光制导方式包括波束制导和半主动雷达制导（SARH）[7]。这种技术有时也被称为半主动激光制导（SAL），在半主动激光制导模式下，需要持续利用激光对目标进行照射，目标反射的激光会向四面八方散射（这一过程被称为“目标镭射指示”或“镭射标定”）。 武器在目标区域附近投放后（例如导弹或精确制导炸弹），其内部集成的激光制导器将探测并追踪由目标反射回来的激光能量，并以此调整发射体的飞行轨迹，最终精确击中目标。"
 laser_guide_mun: "精确制导导弹"
 laser_guide_mun_desc: "精确制导导弹 (PGM)，又称智能武器、智能导弹或智能炸弹，是一种能够精确命中特定目标的制导导弹。其设计目的是最小化附带毁伤并最大化对预定目标的杀伤效果。由于爆炸性武器的毁伤效应随距离呈三次方反比衰减规律，即使对命中精度进行适度提升（进而缩小脱靶率），也能够通过减少攻击所需弹药的数量或弹头当量来达成目标。因此，即使出现未命中情况，也可降低飞行员的风险，并减轻对非战斗人员的影响，以及限制附带毁伤。"
 aam46: "极早期空空导弹"
 aam46_desc: ""
 aam50: "早期空空导弹"
 aam50_desc: "1956年，美国海军和空军开始列装制导导弹，这标志着空战进入了一个新的时代。美国空军率先部署了AIM-4 隼式空空导弹，而美国海军则选择了AIM-7 麻雀和AIM-9 响尾蛇空空导弹。而一年后的1957年，苏联空军也推出了K-5导弹，加入制导空空导弹的行列。"
 aam60: "超视距导弹"
 aam60_desc: "伴随导弹系统技术的不断发展，现代空战已经演化为以导弹攻击为主的作战模式。由于超视距作战在美国空军中应用日益广泛，20世纪60年代早期型号的F-4战斗机甚至只携带了导弹。"
