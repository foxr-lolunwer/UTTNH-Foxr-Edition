 light_battery60: "1960 轻型火炮"
 light_battery60_desc: "相较于单纯增加火炮数量和口径，我们更注重提高现有火炮的射速与精确性。这款火炮配备了先进的测距装置和自动装填系统，即使与早期的一些巡洋舰相比，也毫不逊色。"
 light_battery70: "1970 轻型火炮"
 light_battery70_desc: "我们不会增加火炮数量或口径，而是专注于提高火炮的射速和准确性。这门火炮配备了测距仪和先进的自动装弹机，火力可与一些早期巡洋舰相媲美"
 light_battery80: "1980 轻型火炮"
 light_battery80_desc: "我们不会增加火炮数量或口径，而是专注于提高火炮的射速和准确性。这门火炮配备了测距仪和先进的自动装弹机，火力可与一些早期巡洋舰相媲美。"
 light_battery90: "1990 轻型火炮"
 light_battery90_desc: "凭借自动目标搜索与锁定能力，该火炮可在很大程度上摆脱人工操作，实现智能化作战。"
