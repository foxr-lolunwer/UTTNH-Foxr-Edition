 medium_tank_destroyer_equipment_4_short: "中型坦克歼击车 IV型"
 medium_tank_destroyer_equipment_4_desc: "坦克歼击车，也称自行反坦克炮，是一种以大口径反坦克炮取代传统旋转炮塔，并将火炮固定安装于车体之上的装甲战斗车辆。 中型坦克歼击车采用中型坦克底盘，因此在保持一定机动性的同时，也具备较为可观的反装甲火力。"
