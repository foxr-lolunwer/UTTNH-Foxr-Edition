 FLTE_welcome_menu_clicked_window_4_link_1_button_4_tooltip: "The Chinese-to-English proofreading platform for this mod, used for reviewing English text."
 FLTE_welcome_menu_clicked_window_4_link_2_title: "UTTNH_2.0"
 FLTE_welcome_menu_clicked_window_4_link_2_title_tooltip: "This mod has obtained permission to release an independent fork based on UTTNH_2.0. The majority of content in this mod is provided by UTTNH_2.0."
 FLTE_welcome_menu_clicked_window_4_link_2_button_1_tooltip: "The Steam Workshop page for this mod."
 FLTE_welcome_menu_clicked_window_4_link_2_button_2_tooltip: "The Discord server for this mod."
