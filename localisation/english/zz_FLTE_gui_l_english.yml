l_english:
 FLTE_welcome_menu_title_tooltip: "This mod currently uses FLTE as its identifier, with UTTNH Foxr Edition as its name.\nCurrent Version: §Y0.2.1-rainbow§!"
 FLTE_welcome_menu_msg_tooltip: "This mod is an independent branch of UTTNH_2.0 and will add more unique content in the future."
 FLTE_welcome_menu_start_button_tooltip_delayed: "Initializes the mod, including:\n- Vanilla starting technology mapping\n- Starting building initialization (Not required for this version)\n- Overriding starting units (Not required for this version)\n\nWill not re-initialize in multiplayer mode (In theory; untested)"
 FLTE_welcome_menu_clicked_window_main_button_tooltip_delayed: "Open the information interface to configure or view mod settings and info"
 FLTE_welcome_menu_clicked_window_0_title: "Welcome to this Mod"
 FLTE_welcome_menu_clicked_window_0_text: "Select a sub-window to view from the buttons on the left:\n£FLTE_texticon_welcome_menu_main_sub_button_1 - Roadmap (Under Construction)\n£FLTE_texticon_welcome_menu_main_sub_button_2 - New Mechanics Tutorial\n£FLTE_texticon_welcome_menu_main_sub_button_3 - Settings (Under Construction)\n£FLTE_texticon_welcome_menu_main_sub_button_4 - Links\n£FLTE_texticon_welcome_menu_main_sub_button_5 - Mod Info\nRight-click any sub-button to return to this page.\nOnce everything is ready, exit the information interface and click the flashing Start button in the bottom right corner to initialize. Initialized changes will fully reflect on the following day.\n\n\nTip: You can enable 'Use external web browser' in the game options to open web links."
 FLTE_welcome_menu_clicked_window_1_text: "Under Construction / To Be Developed"
 FLTE_welcome_menu_clicked_window_2_text: "§YResearch Tiers§!\nNow almost all researchable technologies have a research tier requirement. Research tiers across all fields range from I to VII.\nAfter clicking the initialization button, initial research tiers will be automatically assigned based on each country's current technology and factory count.\nResearch tiers must be improved through special projects. Specifically, $specialization_land$, $specialization_naval$, and $specialization_air$ need to be upgraded via the $specialization_engineering$ special project.\n\n§YNew Construction Mechanics and Buildings§!\nNow many buildings, such as $infrastructure$, require corresponding technologies to unlock or increase their level caps.\nAt the same time, this mod adds several new buildings, including $industrial_expansion$ which provides state building slots, and $resource_expansion_steel$ which provides strategic resources.\n\n§YSome Tips§!\n\nBe sure to plan your technology development path in advance at the start of the game and make trade-offs; changing your research direction halfway will waste a lot of time. If you lack breakthrough points, you can research the corresponding breakthrough technologies, though it takes a relatively long time.\nWhen playing major nations, pay attention to properly allocating research time for industry or production technologies—don't get bogged down researching these continuously and neglect equipment R&D. When researching certain industry technologies, their corresponding vanilla technologies will be unlocked; this process is hidden. Therefore, mechanics relying on vanilla technologies can still be triggered and verified."
 FLTE_welcome_menu_clicked_window_3_text: "Under Construction / To Be Developed"
 FLTE_welcome_menu_clicked_window_5_text: "Mod Name: UTTNH Foxr Edition\nCurrent Version: $FLTE_LOCT_mod_version$\nCredits:\nUTTNH_2.0: Granted permission to release an independent fork and utilize future updates.\n(Rt56) Industrial Expansion - Extra Building Slots and Resources!: Granted permission to publish modified versions."
 FLTE_LOCT_mod_version: "0.2.1-rainbow"
 FLTE_welcome_menu_clicked_window_4_title: "Web Links"
