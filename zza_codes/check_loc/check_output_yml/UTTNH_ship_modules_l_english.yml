 ship_60_light_battery: "60s Lightweight Gun" 
 ship_60_light_battery_desc: "Rather than increasing the number of guns, or the calibre of those guns, we will instead focus on increasing the rate of fire and accuracy of our cannons. Equipped with a rangefinder, and an advanced automatic loader, this gun rivals some earlier cruisers in firepower." 
 ship_70_light_battery: "70s Lightweight Gun" 
 ship_70_light_battery_desc: "An advanced automatic cannon, 5 or 6 inches in calibre, with a fire rate approaching 60 rounds per minute, this gun can hit a small target at a dozen kilometers." 
 ship_80_light_battery: "80s Lightweight Gun" 
 ship_80_light_battery_desc: "As computers get smaller and smaller, we've been able to fit this turret with a radar set, integrated into a semi-automatic fire control system." 
 ship_90_light_battery: "90s Lightweight Gun" 
 ship_90_light_battery_desc: "Capable of finding and locking onto a target automatically, this gun does most of the work without any human intervention." 
 ship_ciws_1: "80s CIWS" 
 ship_ciws_1_desc: "A close-in weapon system is a point-defense weapon system for detecting and destroying short-range incoming missiles and enemy aircraft which have penetrated the outer defenses, typically mounted shipboard in a naval capacity. Nearly all classes of larger modern warships are equipped with some kind of CIWS device." 
 ship_ciws_2: "90s CIWS" 
 ship_ciws_2_desc: "A close-in weapon system is a point-defense weapon system for detecting and destroying short-range incoming missiles and enemy aircraft which have penetrated the outer defenses, typically mounted shipboard in a naval capacity. Nearly all classes of larger modern warships are equipped with some kind of CIWS device." 
