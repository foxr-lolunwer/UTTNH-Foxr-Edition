 modern_tank_chassis_7: "80' Modern Battle Tank"
 main_battle_tank_chassis_7: "80' Modern Battle Tank"
 modern_tank_chassis_8_desc: "The threats that a tank on the modern battlefield face are both more numerous and far more lethal than before. Shaped charge rockets, carried by a single brave soldier, can destroy a million-dollar tank, while helicopters and fast-flying jet fighters have no trouble wiping out entire platoons of armored vehicles. However, the tank is arguably still the most important feature of the modern battlefield - and this modern chassis is the result of 50 years of experience."
 main_battle_tank_chassis_8_desc: "The threats that a tank on the modern battlefield face are both more numerous and far more lethal than before. Shaped charge rockets, carried by a single brave soldier, can destroy a million-dollar tank, while helicopters and fast-flying jet fighters have no trouble wiping out entire platoons of armored vehicles. However, the tank is arguably still the most important feature of the modern battlefield - and this modern chassis is the result of 50 years of experience."
