 rocketry60: "1960s Rocketry" 
 rocketry60_desc: "Liquid hydrogen engines were first successfully developed in America, the RL-10 engine first flew in 1962. Hydrogen engines were used as part of the Apollo program; the liquid hydrogen fuel giving a rather lower stage mass and thus reducing the overall size and cost of the vehicle." 
 rocketry70: "1970s Rocketry" 
 rocketry70_desc: "Improved designs enabled the introduction of faster and more deadly missiles." 
