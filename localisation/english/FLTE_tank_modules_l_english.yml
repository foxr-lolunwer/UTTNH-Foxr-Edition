 armor_tech_5: "Post War Armor Protection"
 armor_tech_5_desc: "While superheavy tanks are arguably not as useful as once believed, new welding and casting techniques have resulted in the ability to make extremely thick steel, capable of withstanding heavy punishment."
 armor_tech_7: "Early Cold War Armor Protection"
 armor_tech_7_desc: "Composite armor layouts can protect against munitions much better than equivalent thickness steel plates, while weighing much less."
 armor_tech_9: "Mid Cold War Armor Protection"
 armor_tech_9_desc: "Rather than increasing the thickness of armor to impractical levels, we should instead invest in making 'smarter' armor - which, while taking up more space, weighs much less than steel."
 armor_tech_10: "Late Cold War Armor Protection"
 armor_tech_10_desc: "Advancements are always possible with armor protection. Whether improved chemistry, or stronger composites, tanks of the future will be very well protected."
 armor_tech_11: "Post Cold War Armor Protection"
 armor_tech_11_desc: "With the third generation of main battle tanks, with advanced high-velocity cannons firing rounds that can penetrate nearly a meter of steel, we need to protect our crewmembers and vehicles."
 # FLTE code replace engine_tech_4
 engine_tech_5: "Post War Engine"
 engine_tech_5_desc:"While the modern engines are already fairly capable, there are always advances to be made. New technologies such as multi-barrel carburettors and forced induction allow much higher power outputs."
 engine_tech_7: "Early Cold War Engine"
 engine_tech_7_desc:"As tanks reach towards 60 tonnes in weight, we need engines with over a thousand horsepower to keep up with the other mechanized arms of service."
 engine_tech_9: "Mid Cold War Engine"
 engine_tech_9_desc:"Improvements to fuel quality and precision engineering, as well as novel new materials, enable engines that can propel a vehicle at highway speeds."
 engine_tech_10: "Late Cold War Engine"
 engine_tech_10_desc:"Only so much can be done to improve existing models. Eventually, we will need to develop brand new designs, for both diesel and gas turbine engines, to take full advantage of new technologies."
 engine_tech_11: "Post Cold War Engine"
 engine_tech_11_desc: "The modern tank engine must be fast, yet reliable - it must not choke in dusty environments, or fail to start when it is cold out. With fuel injection and twinchargers, engines can be made that produce obscene amounts of power."
