 early_modern_anti_air_cannon:"Twin 37mm AA Guns"
 early_modern_anti_air_cannon_desc:"With the introduction of jet aircraft, older anti-aircraft guns are simply incapable of dealing with modern aircraft. As such, the development of a smaller caliber, but much higher velocity gun is the natural evolution - while not necessarily capable of destroying an aircraft in a single hit, the higher muzzle velocity means aiming is simplified."
 modern_anti_air_cannon:"Rotary 20mm AA Gun"
 modern_anti_air_cannon_desc:"A multi-barrel rotary autocannon, capable of shredding a line clean through the sky - with devastating effects on any unfortunate aircraft caught in the way."
 advanced_modern_anti_air_cannon:"Surface-to-Air Missile Battery"
 advanced_modern_anti_air_cannon_desc:"An air-defence battery, with a number of anti-aircraft missiles. Fully digitized and coordinated with both radar and other air-defence aspects, this weapon system can intelligently intercept and destroy any aircraft daring enough to enter its space."
