 armor_piercing_bombs_desc: "Warships have steadily increased their deck armor to defeat this specialist bombs must be developed to penetrate this armor."
 air_torpedoe_1_desc: "lightweight torpedoes must be developed so that they can be carried by our aircraft."
 air_torpedoe_2_desc: "advances in aircraft allows up to develop larger more powerful torpedoes."
 air_torpedoe_3_desc: "By combining the latest techknowlogies we can create highly advanced torpedoes for our aircraft."
 light_mg_4x_desc: "What this set of four rifle-caliber lacks in destructiveness, it makes up for in sheer volume."
 bomb_locks: "Bomb Locks I"
 torpedo_mounting: "Torpedo Mountings"
 torpedo_mounting_desc: "Hardpoints to allow a torpedo to be mounted under the fuselage. This gives the plane a potent weapon to use against enemy ships."
 heavy_mg_2x: "2x Heavy Machine Gun I"
 heavy_mg_4x: "4x Heavy Machine Gun I"
 aircraft_cannon_2_1x_desc: "Firing a larger and more powerful shell than previous iterations of autocannons, this weapon can bring down even a large airframe in a single hit."
 bouncing_bomb_release_desc: "A bomb rack for carrying and releasing special bouncing bombs, that skid across the water unitl they hit their targets. The mechanism sets the bomb spinning backwars during the release, making it more likely to reach its intented structural target."
 medium_bomb_bay_desc: "A mid-sized bomb bay allows carrying enough ordinace to strike a wide variety of targets."
 large_bomb_bay_desc: "A large bay to carry enough ordinace to damage or destroy even extensive factories and other hard targets."
 self_sealing_fuel_tanks_small: "Self Sealing Fuel Tanks"
 hmg_defense_turret: "Heavy MG Defense Turret I"
 hmg_defense_turret_2x: "Heavy MG Defense Turret 2x I"
 cannon_defense_turret: "Cannon Defense Turret I"
 cannon_defense_turret_2x: "Cannon Defense Turret 2x I"
 bomb_sights_1_desc: "A complex mechanical computer that takes into account wind drift, terminal velocity and altitude allows the bombadier to drop bombs with a high degree of accuracy."
 radio_navigation_1_desc: "A radio reciever listening for the crossing of two fairly simple radio-navigation beams, making it possible to find a target even in perfect darkness."
 radio_navigation_2_desc: "A radio reciever that also includes a number of distance measuring aides, telling the bombadier the exact moment that the bombs should be released, even if he can not see the target."
 drop_tanks: "Drop Tanks I"
 dive_brakes_small_desc: "A set of spoilers along the trailing edge of the wing deploy when the plane enters a dive, reducing overall speed and allowing the plane to pull out of steep dives without ripping its wings off. this, in turn, allows the plane to attack from a near-vertical dive, drastically increasing accuracy."
 floats_desc: "A seat of floatation devices mounted under the airframe allows the plane to land on water. This makes scouting missions for enemy naval assets easier, but also drastically reduces agility."
 flying_boat_medium_desc: "Instead of mounting a landing gear, the underside of the plane can be shaped to be able to land on water. this makes scouting missions over water much easier."
 guided_anti_ship_missile: "Guided Anti Ship Missile I"
 demining_coil_desc: "A large coil mounted on the airframe allows the plane to project a powerful magentic field, which causes magnetic mines in its flightpath to explode."
