# 科研项目
  sp_FLTE_tech_tier_ordn_1: "陆军军械 T1"
  sp_FLTE_tech_tier_ordn_1_desc: "建立近代标准化兵工生产体系，摒弃传统手工锻造模式，制定通用军械制造规范，实现制式枪械、火炮的流水线批量生产，完成陆军基础武器的近代化迭代。"
  sp_FLTE_tech_tier_ordn_2: "陆军军械 T2"
  sp_FLTE_tech_tier_ordn_2_desc: "深化冶金工艺与弹道力学研究，优化火炮身管材质与结构设计，提升身管抗压、耐热与使用寿命，同时改良步兵轻武器机械结构，强化枪械可靠性与射击稳定性。"
  sp_FLTE_tech_tier_ordn_3: "陆军军械 T3"
  sp_FLTE_tech_tier_ordn_3_desc: "推进重型火炮机动化改造，适配机械化牵引设备，同步搭建标准化机械化步兵武器体系，统一各类单兵、班组及支援武器规格，适配规模化野战作战需求。"
  sp_FLTE_tech_tier_ordn_4: "陆军军械 T4"
  sp_FLTE_tech_tier_ordn_4_desc: "优化大口径火炮锻造工艺与弹药结构设计，升级穿甲、爆破类弹药性能，全面提升陆军正面攻坚、装甲穿透与战场火力压制能力。"
  sp_FLTE_tech_tier_ordn_5: "陆军军械 T5"
  sp_FLTE_tech_tier_ordn_5_desc: "突破聚能破甲技术与单兵自动武器研发瓶颈，迭代更新反装甲弹药与班组自动火器，实现步兵单位火力密度、精准度与反装甲作战能力的全方位提升。"
  sp_FLTE_tech_tier_ordn_6: "陆军军械 T6"
  sp_FLTE_tech_tier_ordn_6_desc: "整合反坦克制导武器与车载机械化火控系统，将精确制导打击技术融入传统地面军械体系，构建高精度、立体化的陆军地面火力打击网络。"
  sp_FLTE_tech_tier_ordn_7: "陆军军械 T7"
  sp_FLTE_tech_tier_ordn_7_desc: "融合微电子控制技术与新型轻量化、高强度复合材料，完成军械装备的信息化迭代，实现各类武器全天候、高精度、自动化作业能力升级。"

  sp_FLTE_tech_tier_vehc_1: "陆地载具 T1"
  sp_FLTE_tech_tier_vehc_1_desc: "探索内燃机动力与履带、轮式底盘的适配应用，基于民用车辆结构改造军用载具，打造可适配战场运输、简易战术突破的初代军用机动平台。"
  sp_FLTE_tech_tier_vehc_2: "陆地载具 T2"
  sp_FLTE_tech_tier_vehc_2_desc: "优化载具传动系统与悬挂结构，提升越野通行性能，制定军用卡车、铁路机车、轻型装甲车的通用底盘制造标准，完善基础军用载具体系。"
  sp_FLTE_tech_tier_vehc_3: "陆地载具 T3"
  sp_FLTE_tech_tier_vehc_3_desc: "搭载标准化大功率引擎与专业化军用车体结构，全面提升陆军战术机动、兵员投送、物资转运及铁路后勤物流的综合承载与吞吐效率。"
  sp_FLTE_tech_tier_vehc_4: "陆地载具 T4"
  sp_FLTE_tech_tier_vehc_4_desc: "攻克重型载具高负荷悬挂、大扭矩传动箱核心技术，满足大吨位作战战车、半履带及重型轮式运输车辆的批量生产与高强度战场使用需求。"
  sp_FLTE_tech_tier_vehc_5: "陆地载具 T5"
  sp_FLTE_tech_tier_vehc_5_desc: "推进全品类陆地军用载具的机械化、柴油动力化全面改造，研发专业化履带式步战车、重型后勤牵引车，细化战场机动与后勤保障载具分工。"
  sp_FLTE_tech_tier_vehc_6: "陆地载具 T6"
  sp_FLTE_tech_tier_vehc_6_desc: "普及大功率集成动力包与通用模块化底盘，搭建标准化轮式战术载具体系，构建可全域机动、快速响应的陆军地面机动作战网络。"
  sp_FLTE_tech_tier_vehc_7: "陆地载具 T7"
  sp_FLTE_tech_tier_vehc_7_desc: "集成车载智能电子管理系统、新型防护装甲与模块化通用底盘，实现各类战术、后勤载具的信息化升级，大幅提升战场生存力与任务适配性。"

  sp_FLTE_tech_tier_airf_1: "空军装备 T1"
  sp_FLTE_tech_tier_airf_1_desc: "挖掘木布结构飞行器与早期活塞引擎的性能极限，改造初代空中平台，将单一战术侦察飞行器升级为具备基础对地、对空打击能力的军用飞行器。"
  sp_FLTE_tech_tier_airf_2: "空军装备 T2"
  sp_FLTE_tech_tier_airf_2_desc: "突破全金属机身制造与悬臂单翼气动设计技术，完成战斗机、近距离支援机、多引擎轰炸机的机型分化，建立专业化军机研发制造体系。"
  sp_FLTE_tech_tier_airf_3: "空军装备 T3"
  sp_FLTE_tech_tier_airf_3_desc: "列装大马力活塞引擎、可变螺距螺旋桨与封闭式座舱结构，全方位提升军用飞机的飞行升限、续航航程与战场突防速度，优化基础飞行性能。"
  sp_FLTE_tech_tier_airf_4: "空军装备 T4"
  sp_FLTE_tech_tier_airf_4_desc: "攻克引擎涡轮增压、高辛烷值航空燃料与大容积内置弹舱技术，支撑重型战略轰炸机、高空高速截击机的规模化量产与实战应用。"
  sp_FLTE_tech_tier_airf_5: "空军装备 T5"
  sp_FLTE_tech_tier_airf_5_desc: "完成飞行器后掠翼气动布局迭代，突破早期喷气式发动机核心技术，实现航空动力从活塞式向喷气式跨越，开启喷气战机时代。"
  sp_FLTE_tech_tier_airf_6: "空军装备 T6"
  sp_FLTE_tech_tier_airf_6_desc: "应用加力涡喷、涡扇发动机与超音速气动设计，研发具备全天候拦截、精准战术轰炸、垂直起降功能的机型，构建现代化多功能空中作战梯队。"
  sp_FLTE_tech_tier_airf_7: "空军装备 T7"
  sp_FLTE_tech_tier_airf_7_desc: "搭载大推重比先进涡扇发动机、高精度机载雷达与隐身气动外形，全面提升军机态势感知、超音速巡航与隐蔽突击能力，实现空军战力信息化、现代化升级。"

  sp_FLTE_tech_tier_naval_1: "海军装备 T1"
  sp_FLTE_tech_tier_naval_1_desc: "建立近代标准化造船工艺与舰船水密分舱结构体系，整合早期蒸汽动力系统与制式舰炮，打造具备远洋航行与基础作战能力的铁甲舰、巡洋舰编队。"
  sp_FLTE_tech_tier_naval_2: "海军装备 T2"
  sp_FLTE_tech_tier_naval_2_desc: "普及高压蒸汽轮机动力、渗碳防护装甲与舰体装甲带设计，统一主力作战舰、轻型护航舰及民用运输船的建造规范，完善海军舰船体系。"
  sp_FLTE_tech_tier_naval_3: "海军装备 T3"
  sp_FLTE_tech_tier_naval_3_desc: "采用全重炮主力舰布局与大口径高效舰炮，研发专用两栖抢滩登陆载具，显著提升舰队远洋决战火力与跨海兵力投送、两栖作战能力。"
  sp_FLTE_tech_tier_naval_4: "海军装备 T4"
  sp_FLTE_tech_tier_naval_4_desc: "突破高压锅炉、高强度整体焊接船体与现代化舰船辅机技术，具备大吨位战列舰、高速驱逐舰、大型远洋补给舰的批量建造能力。"
  sp_FLTE_tech_tier_naval_5: "海军装备 T5"
  sp_FLTE_tech_tier_naval_5_desc: "迭代舰船动力系统，普及柴油、燃气轮机动力，优化船体流线型设计，研发专业化船坞登陆舰、远洋补给平台与现代化静音潜艇。"
  sp_FLTE_tech_tier_naval_6: "海军装备 T6"
  sp_FLTE_tech_tier_naval_6_desc: "掌握舰船核反应堆动力技术，升级现代化舰船防护体系与远洋物流补给结构，打造具备无限续航、长期远洋部署能力的水面、水下作战舰队。"
  sp_FLTE_tech_tier_naval_7: "海军装备 T7"
  sp_FLTE_tech_tier_naval_7_desc: "应用自动化造船工艺、低可探测性隐身舰体设计与综合电力推进系统，实现舰船隐身化、全电化、智能化升级，适配现代化远洋海战需求。"

  sp_FLTE_tech_tier_infr_1: "工业发展 T1"
  sp_FLTE_tech_tier_infr_1_desc: "搭建基础工业生产标准与蒸汽动力配套体系，整合零散手工工坊与小型作坊，组建具备流水线批量生产能力的初代近代工业体系。"
  sp_FLTE_tech_tier_infr_2: "工业发展 T2"
  sp_FLTE_tech_tier_infr_2_desc: "普及标准化电网与通用工业标准件，建立重工业厂房建设、矿山资源开采、大型基建工程的标准化施工与生产规范。"
  sp_FLTE_tech_tier_infr_3: "工业发展 T3"
  sp_FLTE_tech_tier_infr_3_desc: "全面推广流水线组装作业模式，应用大型冶炼高炉与机械化施工设备，大幅提升工业生产效率与大型军工、基建工程的建造速度。"
  sp_FLTE_tech_tier_infr_4: "工业发展 T4"
  sp_FLTE_tech_tier_infr_4_desc: "掌握连续轧钢、预制构件量产与重型起重装备核心技术，实现大型军工设施、交通干线、工业基地的多项目并行高效建设。"
  sp_FLTE_tech_tier_infr_5: "工业发展 T5"
  sp_FLTE_tech_tier_infr_5_desc: "推进工厂生产自动化改造与现代化化工体系升级，优化资源加工与利用流程，推动工业生产向高效率、高产能、精细化方向迭代。"
  sp_FLTE_tech_tier_infr_6: "工业发展 T6"
  sp_FLTE_tech_tier_infr_6_desc: "引入数控加工设备、高压大容量输电网络与现代化建材生产线，构建韧性强、扩张速度快、适配军工刚需的现代化工业基础体系。"
  sp_FLTE_tech_tier_infr_7: "工业发展 T7"
  sp_FLTE_tech_tier_infr_7_desc: "落地计算机集成制造、全自动生产线与模块化快速建造技术，实现工业生产与工程建设的高精度、高效率、极速响应式现代化升级。"

  sp_FLTE_tech_tier_prod_1: "装备生产 T1"
  sp_FLTE_tech_tier_prod_1_desc: "建立基础工时统计体系与精细化劳动分工规则，将科学化管理理念与工程经验应用于军械生产，提升车间标准化重复作业效率。"
  sp_FLTE_tech_tier_prod_2: "装备生产 T2"
  sp_FLTE_tech_tier_prod_2_desc: "推行军械零件通用互换标准与专业化工装夹具体系，通过工业工程优化生产流转流程，降低武器装配过程中的人工适配与修配成本。"
  sp_FLTE_tech_tier_prod_3: "装备生产 T3"
  sp_FLTE_tech_tier_prod_3_desc: "搭建脉冲式移动装配生产线，完善战时劳动力动员调配模型，结合人体工程学优化工位布局，实现复杂军械的连续化、规模化流水生产。"
  sp_FLTE_tech_tier_prod_4: "装备生产 T4"
  sp_FLTE_tech_tier_prod_4_desc: "应用运筹学生产调度体系，普及冲压、压铸精密加工工艺，建立完善的军工质检流程，有效缩短高精尖军械的生产周期与产能爬坡时长。"
  sp_FLTE_tech_tier_prod_5: "装备生产 T5"
  sp_FLTE_tech_tier_prod_5_desc: "融合统计质量控制体系与现代化精密机械加工技术，在保障军械零部件高精度公差标准的同时，大幅提升生产工时利用率与产能转化率。"
  sp_FLTE_tech_tier_prod_6: "装备生产 T6"
  sp_FLTE_tech_tier_prod_6_desc: "引入自动化生产流水线与精益生产管理模式，配套科学化人员激励机制，搭建损耗低、灵活性强、适配多品类装备的现代化军工生产网络。"
  sp_FLTE_tech_tier_prod_7: "装备生产 T7"
  sp_FLTE_tech_tier_prod_7_desc: "整合计算机辅助制造、柔性生产系统与全维度供应链管理体系，实现军械生产的自动化、弹性化、按需定制化，完成军工生产体系的现代化终极迭代。"

  sp_FLTE_tech_tier_elec_1: "电子工程 T1"
  sp_FLTE_tech_tier_elec_1_desc: "确立基础电磁学工程应用标准，实现无线电报、矿石检波器、简易继电器的工业化适配，形成可落地应用的初代军用通信电子设备体系。"
  sp_FLTE_tech_tier_elec_2: "电子工程 T2"
  sp_FLTE_tech_tier_elec_2_desc: "突破真空管批量制造技术与高频振荡电路设计工艺，研发高频军用对讲设备与初代机电式计算设备，夯实军用电子技术发展基础。"
  sp_FLTE_tech_tier_elec_3: "电子工程 T3"
  sp_FLTE_tech_tier_elec_3_desc: "应用甚高频调频通信技术、机电式火控计算机与初代脉冲雷达，实现对空、对海目标的基础探测与弹道数据自动解算，赋能基础作战辅助。"
  sp_FLTE_tech_tier_elec_4: "电子工程 T4"
  sp_FLTE_tech_tier_elec_4_desc: "攻克微波磁控管、无线电近炸引信与电子管运算组件技术，搭建高精度对空对海雷达探测网络与初代军用电子计算平台。"
  sp_FLTE_tech_tier_elec_5: "电子工程 T5"
  sp_FLTE_tech_tier_elec_5_desc: "推进晶体管研发与固态电子技术落地，普及机载、舰载三坐标探测雷达与全电子化火控系统，实现军用电子设备小型化、精准化升级。"
  sp_FLTE_tech_tier_elec_6: "电子工程 T6"
  sp_FLTE_tech_tier_elec_6_desc: "应用集成电路、脉冲多普勒雷达与通用数字计算机，搭建全天候电子对抗、自动火控联动体系，构建现代化战场电子作战系统。"
  sp_FLTE_tech_tier_elec_7: "电子工程 T7"
  sp_FLTE_tech_tier_elec_7_desc: "搭载大规模集成电路、有源相控阵雷达与高性能微处理器，实现军用电子设备高度集成化、数字化，全面提升战场感知、对抗与控制能力。"

  sp_FLTE_tech_tier_spac_1: "太空科技 T1"
  sp_FLTE_tech_tier_spac_1_desc: "完善空气动力学与高空火箭动力基础理论，突破液氧-酒精双推进剂配比与初代陀螺仪制导技术，完成探空火箭研发，实现近地空间初步探测探索。"
  sp_FLTE_tech_tier_spac_2: "太空科技 T2"
  sp_FLTE_tech_tier_spac_2_desc: "攻克多级火箭分离、可控喷管调节与高空遥测传输技术，掌握人造卫星入轨核心工艺，实现人造天体常态化进入近地轨道。"
  sp_FLTE_tech_tier_spac_3: "太空科技 T3"
  sp_FLTE_tech_tier_spac_3_desc: "研发高比冲液氢液氧火箭发动机、载人生命保障系统与飞行器热防护结构，实现载人航天飞行、轨道交会对接与近地空间站常态化运行。"
  sp_FLTE_tech_tier_spac_4: "太空科技 T4"
  sp_FLTE_tech_tier_spac_4_desc: "突破超重型运载火箭研发、深空测控组网与无人行星探测技术，具备地月系统及近地行星的深空探测与飞行器投放能力。"
  sp_FLTE_tech_tier_spac_5: "太空科技 T5"
  sp_FLTE_tech_tier_spac_5_desc: "优化空间太阳能供电技术，搭建初代商用通信卫星网络，实现模块化空间站扩建，完成近地轨道空间与电磁环境的常态化监测利用。"
  sp_FLTE_tech_tier_spac_6: "太空科技 T6"
  sp_FLTE_tech_tier_spac_6_desc: "掌握可重复使用航天运载技术，搭建大型轨道光学、红外观测阵列与高精度导航卫星星座，构建全天候全球航天运输与空间感知体系。"
  sp_FLTE_tech_tier_spac_7: "太空科技 T7"
  sp_FLTE_tech_tier_spac_7_desc: "建成大型模块化深空空间站与全域深空通信网络，形成轨道监测、空间防护技术体系，实现航天任务高频次往返、自动化运营与近地空间可控化利用。"

  sp_FLTE_tech_tier_nuclear_1: "原子科技 T1"
  sp_FLTE_tech_tier_nuclear_1_desc: "构建完整的核物理与放射化学基础理论体系，探明铀同位素裂变原理与中子链式反应核心机制，完成原子能开发的前期理论与技术积累。"
  sp_FLTE_tech_tier_nuclear_2: "原子科技 T2"
  sp_FLTE_tech_tier_nuclear_2_desc: "突破气体扩散法同位素分离、核反应堆慢化结构与核弹核心构型设计技术，实现武器级核材料提纯，具备初代裂变式核武器研制生产能力。"
  sp_FLTE_tech_tier_nuclear_3: "原子科技 T3"
  sp_FLTE_tech_tier_nuclear_3_desc: "完善热核聚变基础理论，攻克氘化锂反应应用与核爆次级压缩技术，完成从裂变武器到热核武器的技术跨越，大幅提升核装药威力上限。"
  sp_FLTE_tech_tier_nuclear_4: "原子科技 T4"
  sp_FLTE_tech_tier_nuclear_4_desc: "掌握压水堆、沸水堆商用核电技术，实现核弹头小型化改造与战术核弹药研发，完成核动力技术在大型舰艇、潜艇上的适配应用。"
  sp_FLTE_tech_tier_nuclear_5: "原子科技 T5"
  sp_FLTE_tech_tier_nuclear_5_desc: "研发增殖反应堆技术与核废料无害化处理体系，优化核弹头安全防护设计，实现核能高效民用发电与战略核力量标准化部署。"
  sp_FLTE_tech_tier_nuclear_6: "原子科技 T6"
  sp_FLTE_tech_tier_nuclear_6_desc: "搭建规模化商用核电网络，研发低残留战术核弹药与紧凑型核动力模块，形成兼顾民用能源供给与灵活战略核反击的双重应用体系。"
  sp_FLTE_tech_tier_nuclear_7: "原子科技 T7"
  sp_FLTE_tech_tier_nuclear_7_desc: "突破可控核聚变核心技术，搭建闭合式核燃料循环体系，研发微型模块化核动力源，实现原子能利用向安全、高效、高集成的现代化模式转型。"


