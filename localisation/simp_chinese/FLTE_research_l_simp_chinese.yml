 night_vision3: "1950 夜视仪"
 night_vision3_desc: "虽然夜视系统尚不成熟且不太可靠，但这些系统的可见范围和图像质量都已取得进步。"
 night_vision4: "1960 夜视仪"
 night_vision4_desc: "迄今为止，夜视技术通常采用主动式系统实现——即使用红外光源（通常是聚光灯）照射目标区域，这种红外光对肉眼不可见。然而，如果敌方也配备了红外设备，那么像信标一样暴露自身位置将是巨大的劣势。因此，采用图像增强技术而非红外聚光灯的“被动式”夜视效果要好得多。"
 night_vision5: "1970 夜视仪"
 night_vision5_desc: "这种夜视技术比以前的型号更加可靠，图像质量几乎与肉眼一样好，并为用户将死寂的夜晚照亮到接近白天的水平。"
