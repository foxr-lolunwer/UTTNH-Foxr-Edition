l_english:
 RESEARCH_REPLACE_TRANSFER: "\n$SAVED|H0$ day(s) of previously saved research will be transfereed to the new technology."
 RESEARCH_MODIFIERS_HEADER: "Global stats"
 modern_oil_processing_desc: "Our oil refinineries can be further improved with new advanced oil processing methods like hydrocracking, alkylation, mercaptan oxidation and isomerization."
 advanced_rubber_processing_desc: "A general purpose synthetic rubber recepie with improved processes such as dodecyl mercaptan polymerization modifiers will allow us to expand synthetic rubber production."
 cavity_magnatron: "Cavity Magnatron"
 cavity_magnatron_desc: "Using a tube that generates microwaves called a Cavity Magnatron we can drastically improve existing radar systems ability to detect objects by bouncing waves off of them."
 mountain_gun_desc: "The mountainous terrain of Northern India led to the development of an artillery piece that could be dismantled and carried on muleback to wherever it was needed."
 escort_carriers_desc: "The area covered by a Carrier aircrafts makes escorting trade convoys a much easier task. Securing the flow of resources is essential."
 carrier_battlegroups_desc: "Carriers are able to strike at the enemy from a greater distance than any naval cannon and with eyes in the sky we will never be caught off guard. Carriers in mass is a force to be reckoned with."
 JET_ENGINES_RESEARCHED: "Allows researching technologies that require Jet Engines, such as jet aircrafts"
 degaussing_desc: "By installing powerful electro-magnetic coils, a ship's magentic signature can be dramatically reduced, making it far less vulnerable to magnetic mines."
 improved_seaplane_tender_desc: "Advancements in at-sea replenishment and recovery crane technlogy improves the efficiency of seaplane operations. \n\nMounting a §YSeaplane Tender§! module on §YDestroyer§! improves their ability to detect enemy ships."
 homing_torpedo_desc: "Equipped with an accoustic detector, the torpedo can home in on the biggest source of noise ahead of it - usually the target."
 sp_standard_tenshioned_replenishment_alongside_method: "Standardized Tenshioned Replenishment Alongside Method"
