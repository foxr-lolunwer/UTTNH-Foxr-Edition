 tank_post_war_howitzer:"152mm L/37 Howitzer"
 tank_post_war_howitzer_desc:"By developing a howitzer dedicated for usage in armored fighting vehicles, we can reduce the size of the vehicle while still projecting massive high-explosive shells over vast distances."
 tank_early_modern_howitzer:"155mm L/40 Modern Howitzer"
 tank_early_modern_howitzer_desc:"By using lessons learned from other tank developments, this howitzer has a higher muzzle velocity, and as such a much larger range."
 tank_modern_howitzer:"183mm L/39 Modern Howitzer"
 tank_modern_howitzer_desc:"A huge gun, with a massive muzzle brake and giant shell, capable of devastating anything within range."
 tank_advanced_modern_howitzer:"155mm L/51 Advanced Modern Howitzer"
 tank_advanced_modern_howitzer_desc:"By integrating fire control with a computer system, this gun is far more accurate and far more destructive than any before."
