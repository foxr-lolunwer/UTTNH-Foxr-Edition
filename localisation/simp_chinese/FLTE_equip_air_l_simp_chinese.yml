 USA_jet_fighter_equipment_3: "北美 F-100 超级军刀"
 USA_jet_fighter_equipment_3_short: "F-100 超级军刀"
 USA_jet_fighter_equipment_3_desc: "北美航空公司F-100 超级军刀是美国一款超音速喷气战斗机，曾在1954至1971年间在美国空军服役，其后在美国空军国民警卫队服役至1979年。作为美国空军“世纪系列”的首架战斗机，它是美国空军第一种具备水平超音速飞行能力的战斗机。F-100由北美航空公司开发，设计用于取代F-86“佩刀”战斗机，成为性能更强大的新一代空优战斗机。"
 USA_jet_fighter_equipment_4: "麦克唐纳 F-101 巫毒"
 USA_jet_fighter_equipment_4_short: "F-101 巫毒"
 USA_jet_fighter_equipment_4_desc: "麦克唐纳F-101 巫毒是一款超音速喷气式战斗机，曾在美国空军和加拿大皇家空军服役。"
 USA_jet_fighter_equipment_5: "麦克唐纳-道格拉斯 F-4C 幻影 II型"
 USA_jet_fighter_equipment_5_short: "F-4C 幻影 II型"
 USA_jet_fighter_equipment_5_desc: "麦克唐纳·道格拉斯 F-4 幻影II型，由麦克唐纳飞行器公司为美国海军研制，是一种串列双座、双引擎、全天候、远程超音速喷气式飞机，兼具截击机和战斗轰炸机的能力。"
 USA_jet_fighter_equipment_6: "麦克唐纳 F-4E 幻影 II型"
 USA_jet_fighter_equipment_6_short: "麦克唐纳 F-4E 幻影 II型"
 USA_jet_fighter_equipment_6_desc: "F-4C 进行了升级，包括更先进的航空电子设备和AN/APQ-109雷达。于1965年6月首飞。在美国空军中，一位飞行员和两位武器系统官驾驶F-4D成为了击落多架敌机的王牌飞行员。"
