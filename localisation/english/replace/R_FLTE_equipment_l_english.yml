 GER_mechanized_equipment_1: "Sd.Kfz. 250"
 GER_mechanized_equipment_1_short: "Sonderkraftfahrzeug 250"
 GER_mechanized_equipment_2_desc: "The Sd.Kfz. 250 was a light armoured halftrack, very similar in appearance to the larger Hanomag-designed Sd.Kfz. 251, and built by the DEMAG firm, for use by Nazi Germany in World War II. Most variants were open-topped and had a single access door in the rear."
 GER_mechanized_equipment_3: "Gepanzerter Mannschaftstransportwagen Kätzchen"
 GER_mechanized_equipment_3_short: "Gep. MTW Kätzchen"
 GER_mechanized_equipment_3_desc: "The Gepanzerter Mannschaftstransportwagen Kätzchen (Gep. MTW Kätzchen) (German for kitten) was a German armoured personnel carrier of late World War II. Auto-Union delivered two prototypes during 1944-45. The hull's shape was similar to the hull of the Panzerkampfwagen Tiger II, but much smaller. The vehicle had front wheel drive with five or six overlapping steel road wheels, possibly resembling the never-built E-25 "replacement tank"'s suspension system in appearance. Power was provided by a Maybach HL50 P engine."
 GER_gw_tank_equipment: "A7V Sturmpanzerwagen"
 GER_gw_tank_equipment_short: "A7V"
 GER_gw_tank_equipment_desc: "The A7V was a heavy tank introduced by Germany in 1918, during World War I. They were used in action from March to October 1918, and were the only tanks produced by Germany in World War I to be used in combat."
 GER_light_tank_equipment_2_desc: "The Panzer II was originally designed as a stopgap while larger, more advanced tanks were developed, but it saw extensive use in combat due to a lack of more capable tanks."
 GER_light_tank_equipment_3_desc: "The VK1602 Leopard was a planned German reconnaissance vehicle designed in 1942. It was planned to arm the vehicle with the 75mm Kwk 41, although that was changed to a smaller 50mm cannon. The VK 1602 had sloped frontal armor, influenced by the Panther medium tank. In order to increase cross-country performance, the VK 1602 was fitted with 350mm wide tracks."
 GER_light_tank_artillery_equipment_1: "Sturmpanzer II"
 GER_light_tank_artillery_equipment_1_short: "Sturmpanzer II"
 GER_light_tank_artillery_equipment_3: "Waffentrager Leopard"
 GER_light_tank_aa_equipment_1_desc: "An anti-air cannon mounted on the chassis of a Panzer I tank."
 GER_light_tank_aa_equipment_2: "Sd Kfz 10-5 Sturmflak 20mm Flak 38"
 GER_light_tank_aa_equipment_2_short: "Sd Kfz 10-5 Sturmflak 20mm Flak 38"
 GER_light_tank_aa_equipment_3_desc: "An anti-air cannon mounted on the chassis of a VK1602 tank."
 GER_medium_tank_equipment_2_desc: "Designed as an infantry-support tank, the Panzer IV was not originally intended to engage enemy armor - that function was performed by the lighter Panzer III. However, with the flaws of pre-war doctrine becoming apparent and in the face of Soviet T-34 tanks, the Panzer IV soon assumed the tank-fighting role of its increasingly obsolete cousin. The most widely manufactured and deployed German tank of the Second World War, the Panzer IV was used as the base for many other fighting vehicles."
 GER_heavy_tank_artillery_equipment_3: "Geschützwagen 'Tiger 17'"
 GER_medium_tank_artillery_equipment_1_desc: "The Sd.Kfz. 138/1 Grille (German: 'Cricket') was a Self-Propelled Artillery Piece that was used by Germany during World War II. About 490-500 Grilles were produced. They were used by panzer divisions in the Soviet Union along with units in Poland and France. They were used up to 1945 and they also served in Tunisia where they fought enemy artillery and tanks."
 GER_medium_tank_destroyer_equipment_2_desc: "The Jagdpanzer IV served in the anti-tank sections of Panzer and SS Panzer divisions. They fought in Normandy, the Battle of the Bulge and on the Eastern Front. They were very successful tank destroyers but performed badly when used out of role as substitutes for tanks or assault guns, as most tank destroyers were. In the later stages of the war however, they were increasingly used as tank substitutes, because there was often nothing else available."
 GER_medium_tank_aa_equipment_1_desc: "Nicknamed Möbelwagen(Furniture Van) because of its boxy turret when closed, it was a self-propelled anti-aircraft gun built from the chassis of the Panzer III tank and armed with a 20mm quad-gun."
 GER_heavy_tank_equipment_1_desc: "The Grosstraktor was a series of prototypes to develop a heavier tank in Germany. After the first world war, Germany was restricted in military development by the Versailles Treaty but a secret program under the name cover 'Traktor' was developing armored military vehicles and artillery."
 GER_heavy_tank_destroyer_equipment_3_desc: "The Jagdtiger was the heaviest armored fighting vehicle operationally used during World War II. The vehicle carried a 128 mm PaK 44 L/55 main gun, and carried heavy frontal armor."
 GER_modern_tank_equipment_1: "E-75 Standardpanzer"
 GER_modern_tank_equipment_1_short: "E-75"
 GER_modern_tank_equipment_1_desc: "The Entwicklung series was a late-War attempt by Germany to produce a standardized series of tank designs. There were to be standard designs in six different weight classes. The E-75 Standardpanzer was intended as a standard medium tank, replacing the Panther and Tiger tank series and the conversions based on those tanks."
