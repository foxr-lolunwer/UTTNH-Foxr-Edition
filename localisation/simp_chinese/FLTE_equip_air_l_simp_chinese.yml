 cv_fighter_equipment_4: "1946 舰载喷气式战斗机"
 cv_fighter_equipment_4_short: "1946 舰载喷气式战斗机"
 cv_fighter_equipment_4_desc: "首次采用喷气发动机的战斗机被归类为第一代喷气式战斗机。少数此类飞机在第二次世界大战的最后阶段问世，但仅参与了极少的战斗行动。"
 cv_fighter_equipment_5: "1950 舰载喷气式战斗机"
 cv_fighter_equipment_5_short: "1950 舰载喷气式战斗机"
