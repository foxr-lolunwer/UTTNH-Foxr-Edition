l_english:
 FLTE_pr_exp_trait_1: "Inspired"
 FLTE_pr_exp_trait_1_desc: "This scientist gained inspiration while executing a research task, enhancing their capabilities."
 FLTE_sp_general_pr_option_template: "Reviewed"
 FLTE_sp_general_pr_br_template: "Project Progress Report"
 FLTE_sp_general_pr_br_1: "$FLTE_sp_general_pr_br_template$"
 FLTE_sp_general_pr_br_1_desc: "Our scientists have achieved a monumental breakthrough in core theory. This milestone not only bypassed several technical hurdles but also generated unexpected spillover effects, systematically elevating our nation's entire research framework."
 FLTE_sp_general_pr_br_1_option_1: "$FLTE_sp_general_pr_option_template$"
 FLTE_sp_general_pr_br_2: "$FLTE_sp_general_pr_br_template$"
 FLTE_sp_general_pr_br_2_desc: "The experimental data was exceptionally clear, and key bottlenecks have been overcome. Team morale is soaring, research progress is far ahead of schedule, and an early completion is well within reach."
 FLTE_sp_general_pr_br_2_option_1: "$FLTE_sp_general_pr_option_template$"
 FLTE_sp_general_pr_br_3: "$FLTE_sp_general_pr_br_template$"
 FLTE_sp_general_pr_br_3_desc: "Everything is proceeding strictly according to plan. While there were no major surprises, the scientists steadily completed all planned experimental phases, with all key parameters meeting preliminary design specifications."
 FLTE_sp_general_pr_br_3_option_1: "$FLTE_sp_general_pr_option_template$"
 FLTE_sp_general_pr_br_4: "$FLTE_sp_general_pr_br_template$"
 FLTE_sp_general_pr_br_4_desc: "Despite encountering minor technical difficulties, the team managed to squeeze out incremental progress within our safety margins. Though progress is slow, we are steadily inching closer to our goal."
 FLTE_sp_general_pr_br_4_option_1: "$FLTE_sp_general_pr_option_template$"
 FLTE_sp_general_pr_br_5: "$FLTE_sp_general_pr_br_template$"
 FLTE_sp_general_pr_br_5_desc: "Research efforts have hit a standstill. Current testing has entered a dead loop, with theoretical models failing to account for observed anomalies. We must dedicate more effort to fundamental troubleshooting."
 FLTE_sp_general_pr_br_5_option_1: "$FLTE_sp_general_pr_option_template$"
 FLTE_sp_general_pr_br_6: "$FLTE_sp_general_pr_br_template$"
 FLTE_sp_general_pr_br_6_desc: "A critical testing accident and misleading theory have dealt us a severe blow. Due to the destruction of key prototypes and loss of data, the project must roll back to an earlier stage for restructuring."
 FLTE_sp_general_pr_br_6_option_1: "$FLTE_sp_general_pr_option_template$"
 FLTE_sp_general_pr_scientist_exp_template: "Recent Research Team Status"
 FLTE_sp_general_pr_scientist_exp_1_desc_template: "Through the adjustments made during this iteration, the team established a highly efficient communication protocol and mastered more scientific experimental methods. This accumulated experience will significantly accelerate their future growth."
 FLTE_sp_general_pr_scientist_exp_2_desc_template: "The research team successfully tackled several major scientific hurdles during this phase. This hands-on experience has substantially boosted the scientists' technical proficiency."
 FLTE_sp_general_pr_scientist_exp_3_desc_template: "As the project deepens, the team has gained a richer grasp of technological specifics in this field. Repeated practical trial and error has yielded a §Ynotable increase§! in participants' technical evaluation and execution capabilities."
 FLTE_sp_general_pr_scientist_exp_4_desc_template: "Although the tasks in this phase were somewhat trivial, incremental gains build strength. By working through routine experimental data, the scientists have further reinforced their core competencies."
 FLTE_sp_general_pr_scientist_exp_5_desc_template: "Severe academic disagreements combined with low morale from prolonged high-pressure work have brought the team to the brink of fracturing. Unless this personnel crisis is promptly addressed, a shadow will fall over the project's future."
 FLTE_sp_general_pr_scientist_exp_5_option_1_template: "Let it be"
 FLTE_sp_general_pr_scientist_exp_5_option_2_template: "Intervene immediately"
